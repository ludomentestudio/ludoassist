<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LudoAssist · Docente</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a6b3a;--green2:#2d8a52;--green3:#e8f5ed;
  --navy:#0A192F;--navy2:#1E293B;--slate:#334155;--slate2:#64748B;
  --emerald:#10B981;--ruby:#EF4444;--amber:#F59E0B;--cyan:#06B6D4;
  --purple:#8B5CF6;--wa:#25D366;--yellow:#FFD600;
  --light:#F0F7F2;--white:#FFFFFF;--border:#CBD5E1;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:var(--light);color:var(--slate);min-height:100dvh;display:flex;flex-direction:column;}
#screen-login{position:fixed;inset:0;background:linear-gradient(160deg,#1a4a2a,#0d2b1a 55%,#071a10);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:1.5rem;gap:1rem;overflow:hidden;}
#screen-login.hidden{display:none;}
#screen-login::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(255,255,255,.04) 38px,rgba(255,255,255,.04) 40px),repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(255,255,255,.02) 38px,rgba(255,255,255,.02) 40px);pointer-events:none;}
.util-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.util{position:absolute;font-size:1.5rem;animation:flotar linear infinite;opacity:.4;}
.util:nth-child(1){left:6%;animation-duration:13s;top:110%;}
.util:nth-child(2){left:18%;animation-duration:11s;animation-delay:2s;top:110%;}
.util:nth-child(3){left:30%;animation-duration:16s;animation-delay:.5s;top:110%;}
.util:nth-child(4){left:44%;animation-duration:12s;animation-delay:3s;top:110%;}
.util:nth-child(5){left:58%;animation-duration:15s;animation-delay:1s;top:110%;}
.util:nth-child(6){left:71%;animation-duration:10s;animation-delay:4s;top:110%;}
.util:nth-child(7){left:83%;animation-duration:14s;animation-delay:1.5s;top:110%;}
.util:nth-child(8){left:92%;animation-duration:17s;animation-delay:2.5s;top:110%;}
@keyframes flotar{0%{transform:translateY(0) rotate(0deg);}100%{transform:translateY(-120vh) rotate(360deg);opacity:0;}}
.login-logo{position:relative;z-index:2;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:.85rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;backdrop-filter:blur(8px);animation:fadeUp .6s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.l-ico{font-size:2.6rem;line-height:1;}
.l-app{font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--yellow);line-height:1.1;}
.l-rol{font-size:.62rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:3px;font-weight:700;}
.login-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:1.4rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:.9rem;backdrop-filter:blur(12px);position:relative;z-index:2;animation:fadeUp .6s .15s ease both;}
.lbl{font-size:.65rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:.28rem;display:block;}
.iw{position:relative;}
.ii{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;}
.inp{width:100%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);border-radius:9px;padding:.78rem 1rem .78rem 2.4rem;color:var(--white);font-size:.95rem;font-weight:700;outline:none;transition:border .3s;font-family:'Nunito',sans-serif;}
.inp.c{letter-spacing:2px;text-transform:uppercase;text-align:center;padding-left:1rem;}
.inp:focus{border-color:var(--yellow);}
.inp::placeholder{color:rgba(255,255,255,.3);font-size:.82rem;font-weight:600;letter-spacing:0;}
.btn-login{width:100%;padding:.95rem;background:linear-gradient(135deg,var(--yellow),#ffaa00);color:#1a3a00;border:none;border-radius:9px;font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(255,214,0,.35);transition:transform .2s;}
.btn-login:active{transform:scale(.97);}
.btn-login:disabled{background:rgba(255,255,255,.2);color:rgba(255,255,255,.4);box-shadow:none;}
.l-err{color:#ff8a80;font-size:.78rem;text-align:center;font-weight:700;min-height:16px;}
.l-hint{font-size:.68rem;color:rgba(255,255,255,.35);text-align:center;}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);padding:.65rem 1rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.2);flex-shrink:0;position:sticky;top:0;z-index:500;}
.hdr-brand{font-family:'Fredoka One',cursive;font-size:1rem;letter-spacing:.4px;}
.hdr-brand span{color:var(--yellow);}
.hdr-doc{font-size:.58rem;color:rgba(255,255,255,.68);font-weight:700;margin-top:.05rem;}
.hdr-r{display:flex;align-items:center;gap:.45rem;}
.sync-pill{border-radius:20px;padding:.22rem .65rem;font-size:.6rem;font-weight:800;display:none;border:1px solid transparent;}
.sync-pill.on{display:block;background:rgba(16,185,129,.25);border-color:var(--emerald);color:#6EE7B7;}
.sync-pill.off{display:block;background:rgba(239,68,68,.2);border-color:var(--ruby);color:#FCA5A5;}
.btn-exit{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:var(--white);padding:.28rem .6rem;border-radius:6px;cursor:pointer;font-size:.62rem;font-weight:700;font-family:'Nunito',sans-serif;}
main{flex:1;overflow-y:auto;padding:1rem 1rem 6.5rem;max-width:600px;margin:0 auto;width:100%;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.6rem;}
.chip-e{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:.28rem .85rem;font-size:.7rem;font-weight:800;color:var(--slate);cursor:pointer;transition:all .2s;}
.chip-e.on{background:var(--green3);border-color:var(--green);color:var(--green);}
.btn-addesc{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.22));border:1.5px solid rgba(139,92,246,.4);color:#A78BFA;border-radius:9px;padding:.58rem 1rem;font-size:.78rem;font-weight:800;cursor:pointer;width:100%;margin-bottom:.72rem;font-family:'Nunito',sans-serif;}
.sel-card{background:var(--white);border-radius:12px;padding:.9rem 1rem;margin-bottom:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid var(--green);}
.sel-lbl{font-size:.62rem;color:var(--slate2);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:.6rem;}
.sel-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;margin-bottom:.6rem;}
.sel{background:var(--light);border:1.5px solid var(--border);border-radius:8px;padding:.58rem .4rem;color:var(--navy);font-size:.78rem;width:100%;outline:none;font-family:'Nunito',sans-serif;font-weight:700;}
.sel:focus{border-color:var(--green);}
.btn-load{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:9px;padding:.72rem;font-size:.88rem;font-weight:900;cursor:pointer;width:100%;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(26,107,58,.3);}
.btn-load:active{transform:scale(.98);}
.btn-load:disabled{background:var(--slate2);box-shadow:none;}
.sync-bar{border-radius:9px;padding:.6rem .85rem;margin-bottom:.72rem;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:.45rem;line-height:1.4;}
.sync-bar.on{background:#DCFCE7;border:1.5px solid var(--emerald);color:#166534;}
.sync-bar.off{background:#FEE2E2;border:1.5px solid var(--ruby);color:#991B1B;}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;}
.lh-title{font-size:.9rem;font-weight:900;color:var(--navy);}
.badges{display:flex;gap:.3rem;}
.bdg{font-size:.6rem;font-weight:800;padding:.16rem .42rem;border-radius:7px;}
.bp{background:#DCFCE7;color:#166534;}
.bt{background:#FEF9C3;color:#854D0E;}
.bf{background:#FEE2E2;color:#991B1B;}
.bj{background:#CFFAFE;color:#164E63;}
.abar{display:flex;gap:.45rem;margin-bottom:.6rem;align-items:center;}
.bwrap{position:relative;flex:1;}
.binp{width:100%;padding:.58rem .58rem .58rem 2rem;border:1.5px solid var(--border);border-radius:9px;font-size:.82rem;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;background:var(--white);}
.binp:focus{border-color:var(--green);}
.bico{position:absolute;left:.58rem;top:50%;transform:translateY(-50%);font-size:.82rem;pointer-events:none;}
.btn-all{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(16,185,129,.28));border:1.5px solid var(--emerald);color:#065F46;border-radius:9px;padding:.58rem .8rem;font-size:.72rem;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;}
.al{background:var(--white);border-radius:10px;padding:.68rem .88rem;margin-bottom:.42rem;display:flex;align-items:flex-start;gap:.6rem;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--border);}
.al.sP{border-left-color:var(--emerald);}
.al.sT{border-left-color:var(--amber);}
.al.sF{border-left-color:var(--ruby);}
.al.sJ{border-left-color:var(--cyan);}
.al.hidden{display:none;}
.al-n{font-size:.62rem;font-weight:800;color:var(--slate2);min-width:17px;text-align:center;padding-top:.1rem;flex-shrink:0;}
.al-i{flex:1;min-width:0;}
.al-nom{font-size:.8rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.2px;line-height:1.3;}
.dot-row{display:flex;align-items:center;gap:.28rem;margin-top:.18rem;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dP{background:var(--emerald);}
.dT{background:var(--amber);}
.dF{background:var(--ruby);}
.dJ{background:var(--cyan);}
.dot-lbl{font-size:.58rem;font-weight:800;}
.chips-al{display:flex;flex-wrap:wrap;gap:.22rem;margin-top:.22rem;}
.chip{display:inline-flex;align-items:center;gap:.22rem;border-radius:5px;padding:.14rem .42rem;font-size:.58rem;font-weight:800;line-height:1.3;}
.cj{background:#CFFAFE;color:#164E63;border:1px solid #A5F3FC;}
.cr{background:#FEF9C3;color:#92400E;border:1px solid #FDE68A;}
.cp{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;}
.cs{background:#DCFCE7;color:#166534;border:1px solid #86EFAC;}
.ca{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;}
.cn{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE;cursor:pointer;}
.best{display:flex;gap:.2rem;flex-shrink:0;}
.be{border:2px solid transparent;border-radius:7px;padding:.26rem .28rem;font-size:.85rem;cursor:pointer;opacity:.4;transition:all .2s;min-width:31px;min-height:31px;text-align:center;line-height:1;}
.be.on{opacity:1;transform:scale(1.1);box-shadow:0 2px 5px rgba(0,0,0,.15);}
.bep{background:rgba(16,185,129,.1);}.bep.on{background:var(--emerald);}
.bet{background:rgba(245,158,11,.1);}.bet.on{background:var(--amber);}
.bef{background:rgba(239,68,68,.1);}.bef.on{background:var(--ruby);}
.bej{background:rgba(6,182,212,.1);}.bej.on{background:var(--cyan);}
.np{display:none;margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--border);}
.np.open{display:block;}
.np-prev{margin-bottom:.38rem;}
.np-item{background:#F5F3FF;border-left:3px solid var(--purple);border-radius:0 7px 7px 0;padding:.35rem .58rem;margin-bottom:.28rem;font-size:.7rem;color:#3B0764;line-height:1.45;}
.np-fecha{font-size:.58rem;font-weight:800;color:#7C3AED;margin-bottom:.1rem;}
.np-ta{width:100%;padding:.48rem .62rem;border:1.5px solid #DDD6FE;border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;color:var(--navy);resize:none;height:58px;outline:none;}
.np-ta:focus{border-color:var(--purple);}
.np-btns{display:flex;gap:.38rem;margin-top:.32rem;}
.btn-ns{background:var(--purple);color:white;border:none;border-radius:7px;padding:.36rem .75rem;font-size:.7rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-nx{background:var(--light);border:1px solid var(--border);color:var(--slate);border-radius:7px;padding:.36rem .68rem;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-nwa{background:var(--wa);color:white;border:none;border-radius:7px;padding:.36rem .68rem;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.afin{margin-top:.9rem;display:flex;gap:.55rem;}
.btn-save{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:10px;padding:.85rem 1rem;font-size:.88rem;font-weight:900;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(26,107,58,.3);}
.btn-save:active{transform:scale(.98);}
.btn-new{background:var(--light);border:1.5px solid var(--border);color:var(--slate);border-radius:10px;padding:.85rem 1rem;font-size:.82rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}
/* ALUMNO */
.sg{position:relative;margin-bottom:.85rem;}
.sg input{width:100%;padding:.82rem .82rem .82rem 2.5rem;border:1.5px solid var(--border);border-radius:12px;font-size:.92rem;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;background:var(--white);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sg input:focus{border-color:var(--green);}
.sg-ico{position:absolute;left:.82rem;top:50%;transform:translateY(-50%);font-size:1.05rem;pointer-events:none;}
.al-item{background:var(--white);border-radius:10px;padding:.72rem .95rem;margin-bottom:.42rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;border-left:4px solid var(--border);transition:all .2s;}
.al-item:active{transform:scale(.98);}
.ai-nom{font-size:.8rem;font-weight:800;color:var(--navy);text-transform:uppercase;}
.ai-meta{font-size:.63rem;color:var(--slate2);margin-top:.12rem;}
.det{background:var(--white);border-radius:12px;padding:.95rem;margin-bottom:.85rem;box-shadow:0 2px 10px rgba(0,0,0,.1);border-top:3px solid var(--green);display:none;}
.det.open{display:block;animation:fadeIn .2s ease;}
.det-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;}
.det-nom{font-size:.98rem;font-weight:900;color:var(--navy);}
.det-sub{font-size:.63rem;color:var(--slate2);margin-top:.18rem;}
.btn-dx{background:none;border:none;font-size:1.2rem;color:var(--slate2);cursor:pointer;padding:.15rem .35rem;line-height:1;}
.det-stats{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.75rem;}
.ds{border-radius:8px;padding:.32rem .58rem;font-size:.68rem;font-weight:800;}
.det-sec{margin-bottom:.75rem;}
.det-stit{font-size:.63rem;font-weight:900;color:var(--slate2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.45rem;}
.ar{display:flex;justify-content:space-between;align-items:center;padding:.36rem .52rem;border-radius:7px;margin-bottom:.25rem;}
.ar:nth-child(odd){background:#F8FAFC;}
.ar-f{font-weight:700;color:var(--navy);font-size:.75rem;}
.ar-e{font-weight:800;font-size:.7rem;}
.nd-item{background:#F5F3FF;border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:.48rem .68rem;margin-bottom:.32rem;}
.nd-fecha{font-size:.58rem;font-weight:800;color:#7C3AED;margin-bottom:.12rem;}
.nd-txt{font-size:.78rem;color:var(--navy);line-height:1.5;}
.btn-wa-padre{width:100%;padding:.85rem;background:var(--wa);color:white;border:none;border-radius:10px;font-size:.92rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.45rem;font-family:'Nunito',sans-serif;box-shadow:0 3px 12px rgba(37,211,102,.3);}
.btn-wa-padre:active{transform:scale(.97);}
/* MI GRUPO */
.filtros-g{display:flex;gap:.42rem;margin-bottom:.75rem;overflow-x:auto;padding-bottom:.1rem;}
.fg-btn{border:1.5px solid var(--border);background:var(--white);color:var(--slate);border-radius:22px;padding:.38rem .85rem;font-size:.75rem;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;flex-shrink:0;transition:all .2s;text-align:center;line-height:1.3;}
.fg-btn.on{background:var(--green);border-color:var(--green);color:var(--white);}
.fg-sub{font-size:.58rem;font-weight:600;opacity:.8;display:block;margin-top:.06rem;}
.sg-cards{display:grid;grid-template-columns:1fr 1fr;gap:.52rem;margin-bottom:.85rem;}
.sg-card{background:var(--white);border-radius:11px;padding:.78rem;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.sg-num{font-size:1.45rem;font-weight:900;color:var(--navy);}
.sg-lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--slate2);margin-top:.1rem;}
/* TARJETAS MES */
.meses-wrap{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.45rem;margin-bottom:.85rem;scrollbar-width:none;}
.meses-wrap::-webkit-scrollbar{display:none;}
.mes-card{flex-shrink:0;border-radius:12px;padding:.7rem .82rem;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .25s;min-width:82px;}
.mes-card.mverde{background:#DCFCE7;color:#166534;}
.mes-card.mamarillo{background:#FEF9C3;color:#854D0E;}
.mes-card.mrojo{background:#FEE2E2;color:#991B1B;}
.mes-card.on{border-color:var(--green) !important;box-shadow:0 3px 10px rgba(26,107,58,.3);transform:translateY(-2px);}
.mes-card.on::after{content:'▼';display:block;font-size:.62rem;margin-top:.15rem;opacity:.65;}
.mes-nom{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;}
.mes-pct{font-size:1.3rem;font-weight:900;line-height:1.1;margin:.12rem 0;}
.mes-ses{font-size:.56rem;font-weight:700;opacity:.75;}
/* SEMÁFORO */
.sem-tit{font-size:.63rem;font-weight:900;color:var(--slate2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.52rem;}
.sem-item{background:var(--white);border-radius:9px;padding:.58rem .78rem;margin-bottom:.35rem;display:flex;align-items:center;gap:.62rem;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;}
.sem-item:active{transform:scale(.98);}
.sem-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sv{background:var(--emerald);}
.sa{background:var(--amber);}
.sr{background:var(--ruby);}
.sem-nom{flex:1;font-size:.78rem;font-weight:800;color:var(--navy);}
.sem-meta{font-size:.58rem;color:var(--slate2);}
.sem-pct{font-size:.7rem;font-weight:900;padding:.16rem .38rem;border-radius:8px;}
/* MIS LISTAS */
.hl-card{background:var(--white);border-radius:10px;margin-bottom:.48rem;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.hl-hdr{display:flex;justify-content:space-between;align-items:center;padding:.75rem .88rem;cursor:pointer;border-left:4px solid var(--green);}
.hl-grp{font-size:.88rem;font-weight:900;color:var(--navy);}
.hl-fec{font-size:.63rem;color:var(--slate2);margin-top:.1rem;}
.hl-body{display:none;border-top:1px solid var(--border);}
.hl-body.open{display:block;}
.hl-row{display:flex;justify-content:space-between;align-items:center;padding:.38rem .88rem;border-bottom:1px solid #F1F5F9;}
.hl-row:last-child{border-bottom:none;}
.hl-n{color:var(--navy);font-weight:700;text-transform:uppercase;font-size:.73rem;}
.hl-e{font-size:.7rem;font-weight:800;}
/* MODAL */
#modal-esc{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:600;}
#modal-esc.show{display:flex;}
.mbox{background:var(--white);border-radius:20px 20px 0 0;padding:1.4rem;width:100%;max-width:480px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-tit{font-size:.95rem;font-weight:900;color:var(--navy);margin-bottom:.82rem;}
.m-inp{background:var(--light);border:1.5px solid var(--border);border-radius:9px;padding:.72rem 1rem;color:var(--navy);font-size:1rem;font-weight:700;width:100%;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none;margin-bottom:.62rem;font-family:'Nunito',sans-serif;}
.m-inp:focus{border-color:var(--green);}
.m-err{color:var(--ruby);font-size:.75rem;text-align:center;margin-bottom:.42rem;font-weight:700;min-height:14px;}
.m-btns{display:flex;gap:.55rem;}
.m-ok{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:9px;padding:.75rem;font-size:.88rem;font-weight:900;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;}
.m-cancel{background:var(--light);border:1.5px solid var(--border);color:var(--slate);border-radius:9px;padding:.75rem;font-size:.88rem;font-weight:700;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;}
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--white);padding:.58rem 1.3rem;border-radius:50px;font-size:.78rem;font-weight:800;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--slate2);}
.eico{font-size:2.8rem;margin-bottom:.65rem;}
.empty p{font-size:.85rem;font-weight:700;color:var(--slate);}
.empty small{font-size:.72rem;color:var(--slate2);margin-top:.28rem;display:block;line-height:1.5;}
.loader{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.ldg{text-align:center;padding:2rem;color:var(--slate2);font-size:.82rem;font-weight:700;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:2px solid var(--border);display:flex;z-index:490;box-shadow:0 -2px 10px rgba(0,0,0,.07);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.52rem .3rem;cursor:pointer;color:var(--slate2);font-size:.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;gap:.1rem;border:none;background:transparent;font-family:'Nunito',sans-serif;}
.nb .ni{font-size:1.2rem;}
.nb.on{color:var(--green);}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal-esc">
  <div class="mbox">
    <div class="m-tit">➕ Agregar Escuela</div>
    <input class="m-inp" id="m-cod" placeholder="CÓDIGO" maxlength="10" autocomplete="off">
    <div class="m-err" id="m-err"></div>
    <div class="m-btns">
      <button class="m-cancel" id="m-cancel">Cancelar</button>
      <button class="m-ok" id="m-ok">✅ Verificar</button>
    </div>
  </div>
</div>
<div id="screen-login">
  <div class="util-bg">
    <span class="util">✏️</span><span class="util">📏</span><span class="util">📐</span>
    <span class="util">📚</span><span class="util">🖊️</span><span class="util">📝</span>
    <span class="util">🔭</span><span class="util">🎒</span>
  </div>
  <div class="login-logo">
    <div class="l-ico">📋</div>
    <div class="l-app">LudoAssist</div>
    <div class="l-rol">Lista Docente</div>
  </div>
  <div class="login-card">
    <div>
      <span class="lbl">Código de tu escuela</span>
      <div class="iw"><span class="ii">🏫</span>
        <input class="inp c" id="l-cod" placeholder="Ej: EST17" maxlength="10" autocomplete="off">
      </div>
    </div>
    <div>
      <span class="lbl">Tu nombre completo</span>
      <div class="iw"><span class="ii">👤</span>
        <input class="inp" id="l-nom" placeholder="Nombre completo" autocomplete="off">
      </div>
    </div>
    <button class="btn-login" id="btn-login">✅ Entrar</button>
    <div class="l-err" id="l-err"></div>
    <div class="l-hint">Solicita tu código al director de la escuela</div>
  </div>
</div>
<header>
  <div>
    <div class="hdr-brand">Ludo<span>Assist</span> · Docente</div>
    <div class="hdr-doc" id="hdr-doc">—</div>
  </div>
  <div class="hdr-r">
    <span class="sync-pill" id="sync-pill">⚡</span>
    <button class="btn-exit" id="btn-exit">🔓 Salir</button>
  </div>
</header>
<main id="main"></main>
<nav id="nav" style="display:none;">
  <button class="nb on"  id="nb-lista"     onclick="ir('lista')">     <span class="ni">📋</span>Lista</button>
  <button class="nb"     id="nb-alumno"    onclick="ir('alumno')">    <span class="ni">👤</span>Alumno</button>
  <button class="nb"     id="nb-migrupo"   onclick="ir('migrupo')">   <span class="ni">📊</span>Mi Grupo</button>
  <button class="nb"     id="nb-mislistas" onclick="ir('mislistas')"> <span class="ni">📂</span>Mis Listas</button>
</nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import{getDatabase,ref,get,push,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyD_sJOOY4wQY_473JGj0FXGHm2PzHMC2u0",authDomain:"ludoasistencia.firebaseapp.com",databaseURL:"https://ludoasistencia-default-rtdb.firebaseio.com",projectId:"ludoasistencia",storageBucket:"ludoasistencia.firebasestorage.app",messagingSenderId:"738361802611",appId:"1:738361802611:web:cb13956f002a0e74844f06"}));
const dbGet=(p)=>get(ref(db,p));
const dbPush=(p,d)=>push(ref(db,p),d);
const SK={esc:'ld_e',nom:'ld_n',act:'ld_a'};
let escuelas=JSON.parse(localStorage.getItem(SK.esc)||'[]');
let docNom=localStorage.getItem(SK.nom)||'';
let escAct=localStorage.getItem(SK.act)||'';
let estructura={};
let lista=[];
let gsel={turno:'',grado:'',grupo:''};
let notasC={};
let statsC={};
let alumDet=null;
let mgFiltro='ciclo';
let mgMesSel=null;
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function hoy(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function hora(){return new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});}
function san(s){return(s||'').replace(/[.#$[\]/]/g,'_');}
function norm(n){return(n||'').replace(/^\[ [AM] \] /,'').toUpperCase().trim();}
function mapE(e){if(!e)return'F';const v=e.toLowerCase();if(v==='asistencia')return'P';if(v==='retardo')return'T';if(v.startsWith('justificado'))return'J';return'F';}
function motivo(e){if(!e||!e.toLowerCase().startsWith('justificado'))return null;const i=e.indexOf(' - ');return i>=0?e.slice(i+3).trim():null;}
function calcPct(P,T,tot){return tot>0?Math.round((P+T)/tot*100):0;}
function dotColor(p){return p>=85?'sv':p>=70?'sa':'sr';}
function bgColor(p){return p>=85?'background:#DCFCE7;color:#166534':p>=70?'background:#FEF9C3;color:#854D0E':'background:#FEE2E2;color:#991B1B';}
function mesActual(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}`;}
function mesNom(ym){if(!ym)return'';const[y,m]=ym.split('-');return`${MESES[parseInt(m)-1]} ${y}`;}
function mesCorto(ym){if(!ym)return'';const[,m]=ym.split('-');return MESES_C[parseInt(m)-1];}
function rangoMes(ym){const[y,m]=ym.split('-');const hoyD=new Date();const esEste=mesActual()===ym;const ult=esEste?hoyD.getDate():new Date(parseInt(y),parseInt(m),0).getDate();return`1 al ${ult} de ${MESES[parseInt(m)-1]}`;}
function fechaLeg(iso){if(!iso)return'—';const[y,m,d]=iso.split('-');const dt=new Date(parseInt(y),parseInt(m)-1,parseInt(d));return`${DIAS[dt.getDay()]} ${d} ${MESES_C[parseInt(m)-1]}`;}
function puedeSync(){const t=gsel.turno.toLowerCase();const d=new Date();const min=d.getHours()*60+d.getMinutes();if(t.includes('mat'))return min<=8*60;if(t.includes('vesp'))return min<=15*60;return false;}
function updSyncPill(){const pill=document.getElementById('sync-pill');if(!gsel.turno){pill.className='sync-pill';return;}if(puedeSync()){pill.className='sync-pill on';pill.textContent='⚡ Sync activo';}else{pill.className='sync-pill off';pill.textContent='🔒 Solo interno';}}
let _tt=null;
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');if(_tt)clearTimeout(_tt);_tt=setTimeout(()=>{el.classList.remove('show');_tt=null;},2800);}
function clrToast(){const el=document.getElementById('toast');if(el)el.classList.remove('show');if(_tt){clearTimeout(_tt);_tt=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')clrToast();});
window.addEventListener('pageshow',clrToast);
window.addEventListener('focus',clrToast);
document.getElementById('btn-login').addEventListener('click',async()=>{
  const cod=document.getElementById('l-cod').value.trim().toLowerCase();
  const nom=document.getElementById('l-nom').value.trim();
  const err=document.getElementById('l-err');err.textContent='';
  if(!cod){err.textContent='Ingresa el código de tu escuela.';return;}
  if(!nom){err.textContent='Ingresa tu nombre.';return;}
  const btn=document.getElementById('btn-login');btn.textContent='⏳ Verificando...';btn.disabled=true;
  try{
    const snap=await dbGet(`escuelas/${cod}/configuracion/perfil`);
    if(!snap.exists()){err.textContent='❌ Código no encontrado.';return;}
    const p=snap.val();if(p.activa===false){err.textContent='🔒 Escuela bloqueada.';return;}
    if(!escuelas.find(e=>e.cod===cod)){escuelas.push({cod,nombre:p.nombreEscuela||cod.toUpperCase()});localStorage.setItem(SK.esc,JSON.stringify(escuelas));}
    docNom=nom;localStorage.setItem(SK.nom,nom);
    escAct=cod;localStorage.setItem(SK.act,cod);
    arrancar();
  }catch(e){err.textContent='⚠️ Sin conexión.';}
  finally{btn.textContent='✅ Entrar';btn.disabled=false;}
});
document.getElementById('l-cod').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('l-nom').focus();});
document.getElementById('l-nom').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-login').click();});
document.getElementById('btn-exit').addEventListener('click',()=>{if(!confirm('¿Cerrar sesión?'))return;localStorage.removeItem(SK.nom);localStorage.removeItem(SK.act);location.reload();});
async function arrancar(){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('nav').style.display='flex';
  document.getElementById('hdr-doc').textContent='👤 '+docNom;
  await cargarEst();ir('lista');
}
if(escuelas.length&&docNom&&escAct)arrancar();
function renderChips(cont){cont.innerHTML=escuelas.map(e=>`<div class="chip-e ${e.cod===escAct?'on':''}" onclick="cambiarEsc('${e.cod}')">🏫 ${e.nombre}</div>`).join('');}
window.cambiarEsc=async function(cod){escAct=cod;localStorage.setItem(SK.act,cod);lista=[];gsel={turno:'',grado:'',grupo:''};notasC={};statsC={};await cargarEst();ir('lista');toast('🏫 Escuela cambiada');};
document.getElementById('m-cancel').addEventListener('click',()=>document.getElementById('modal-esc').classList.remove('show'));
document.getElementById('m-ok').addEventListener('click',async()=>{
  const cod=document.getElementById('m-cod').value.trim().toLowerCase();
  const err=document.getElementById('m-err');err.textContent='';
  if(!cod){err.textContent='Ingresa el código.';return;}
  if(escuelas.find(e=>e.cod===cod)){err.textContent='Ya está agregada.';return;}
  const btn=document.getElementById('m-ok');btn.textContent='⏳...';
  try{
    const snap=await dbGet(`escuelas/${cod}/configuracion/perfil`);
    if(!snap.exists()){err.textContent='❌ No encontrada.';return;}
    const p=snap.val();if(p.activa===false){err.textContent='🔒 Bloqueada.';return;}
    escuelas.push({cod,nombre:p.nombreEscuela||cod.toUpperCase()});localStorage.setItem(SK.esc,JSON.stringify(escuelas));
    escAct=cod;localStorage.setItem(SK.act,cod);
    document.getElementById('modal-esc').classList.remove('show');
    await cargarEst();ir('lista');toast('✅ Escuela agregada');
  }catch(e){err.textContent='⚠️ Sin conexión.';}
  finally{btn.textContent='✅ Verificar';}
});
async function cargarEst(){
  try{
    const snap=await dbGet(`escuelas/${escAct}/directorio`);
    estructura={};
    if(snap.exists()){Object.keys(snap.val()).forEach(cl=>{const pts=cl.split('-');if(pts.length<3)return;const[turno,grado,...g]=pts;const grupo=g.join('-');if(!estructura[turno])estructura[turno]={};if(!estructura[turno][grado])estructura[turno][grado]=[];if(!estructura[turno][grado].includes(grupo))estructura[turno][grado].push(grupo);});Object.keys(estructura).forEach(t=>Object.keys(estructura[t]).forEach(g=>estructura[t][g].sort()));}
  }catch(e){toast('⚠️ Error al cargar estructura.');}
}
window.ir=async function(vista){
  ['lista','alumno','migrupo','mislistas'].forEach(v=>document.getElementById('nb-'+v)?.classList.toggle('on',v===vista));
  alumDet=null;
  const m=document.getElementById('main');
  m.innerHTML='<div class="ldg"><div class="loader"></div></div>';
  if(vista==='lista')       renderVista_lista();
  else if(vista==='alumno')     await renderVista_alumno();
  else if(vista==='migrupo')    await renderVista_migrupo();
  else if(vista==='mislistas')  await renderVista_mislistas();
  window.scrollTo(0,0);
};
// ══ LISTA ══
function renderVista_lista(){
  const m=document.getElementById('main');
  const hn=new Date().getHours();const tk=Object.keys(estructura);
  let tAuto=hn<13?tk.find(t=>t.toLowerCase().includes('mat'))||tk[0]||'':tk.find(t=>t.toLowerCase().includes('vesp'))||tk[0]||'';
  m.innerHTML=`<div class="chips" id="chips"></div><button class="btn-addesc" id="btn-ae">➕ Agregar otra escuela</button>
    <div class="sel-card"><div class="sel-lbl">Seleccionar grupo para pasar lista</div>
      <div class="sel-row">
        <select class="sel" id="s-t"><option value="">Turno</option>${tk.map(t=>`<option value="${t}"${t===tAuto?' selected':''}>${t}</option>`).join('')}</select>
        <select class="sel" id="s-g"><option value="">Grado</option></select>
        <select class="sel" id="s-gr"><option value="">Grupo</option></select>
      </div>
      <button class="btn-load" id="btn-load">📋 Cargar Lista</button>
    </div><div id="lc"></div>`;
  renderChips(document.getElementById('chips'));
  document.getElementById('btn-ae').addEventListener('click',()=>document.getElementById('modal-esc').classList.add('show'));
  const st=document.getElementById('s-t'),sg=document.getElementById('s-g'),sgr=document.getElementById('s-gr');
  function fillG(){sg.innerHTML='<option value="">Grado</option>';sgr.innerHTML='<option value="">Grupo</option>';if(!st.value)return;Object.keys(estructura[st.value]||{}).sort((a,b)=>Number(a)-Number(b)).forEach(g=>{sg.innerHTML+=`<option value="${g}">${g}° Grado</option>`;});}
  function fillGr(){sgr.innerHTML='<option value="">Grupo</option>';if(!st.value||!sg.value)return;(estructura[st.value]?.[sg.value]||[]).forEach(g=>{sgr.innerHTML+=`<option value="${g}">${g}</option>`;});}
  st.addEventListener('change',fillG);sg.addEventListener('change',fillGr);
  if(tAuto){st.value=tAuto;fillG();}
  if(gsel.turno&&gsel.grado&&gsel.grupo){st.value=gsel.turno;fillG();sg.value=gsel.grado;fillGr();sgr.value=gsel.grupo;}
  document.getElementById('btn-load').addEventListener('click',cargarLista);
}
async function cargarLista(){
  const turno=document.getElementById('s-t')?.value,grado=document.getElementById('s-g')?.value,grupo=document.getElementById('s-gr')?.value;
  if(!turno||!grado||!grupo){toast('⚠️ Selecciona turno, grado y grupo.');return;}
  gsel={turno,grado,grupo};updSyncPill();
  const btn=document.getElementById('btn-load');btn.textContent='⏳ Cargando...';btn.disabled=true;
  try{
    const cl=`${turno}-${grado}-${grupo}`;
    const sDir=await dbGet(`escuelas/${escAct}/directorio/${cl}`);
    let nombres=[];
    if(sDir.exists()){const v=sDir.val();nombres=(Array.isArray(v)?v:Object.values(v)).filter(Boolean).sort();}
    if(!nombres.length){document.getElementById('lc').innerHTML='<div class="empty"><div class="eico">📭</div><p>Sin alumnos en este grupo.</p></div>';return;}
    const hoyS=hoy();
    const sAs=await dbGet(`escuelas/${escAct}/asistencias`);
    const asH={};
    if(sAs.exists()){sAs.forEach(ch=>{const r=ch.val();if(r.fecha!==hoyS||r.turno!==turno||String(r.grado)!==String(grado)||r.grupoLetra!==grupo)return;const n=norm(r.nombre);if(n)asH[n]=r;});}
    notasC={};
    try{const sN=await dbGet(`escuelas/${escAct}/notas-docente`);if(sN.exists()){sN.forEach(aS=>{const ns=[];aS.forEach(nS=>{const n=nS.val();if(n.maestro===docNom)ns.push(n);});if(ns.length)notasC[aS.key]=ns.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));});}}catch(e){}
    const fAcum={};
    try{const sH=await dbGet(`escuelas/${escAct}/listas-maestro`);if(sH.exists()){sH.forEach(fS=>{if(fS.key===hoyS)return;fS.forEach(gS=>{gS.forEach(sS=>{const r=sS.val();if(r.maestro!==docNom||r.turno!==turno||String(r.grado)!==String(grado)||r.grupo!==grupo)return;(r.alumnos||[]).forEach(a=>{const n=norm(a.nombre);if(a.estatusMaestro==='F')fAcum[n]=(fAcum[n]||0)+1;});});});});}}catch(e){}
    lista=nombres.map(nombre=>{const reg=asH[norm(nombre)]||null;return{nombre,raw:reg?.estatus||null,retiro:reg?.retiroTemprano||false,horaR:reg?.horaRetiro||null,horaO:reg?.horaEntradaOriginal||null,regPor:reg?.registradoPor||null,est:mapE(reg?.estatus),faltas:fAcum[norm(nombre)]||0,sync:false};});
    renderListaC();
  }catch(e){toast('❌ Error cargando lista.');console.error(e);}
  finally{const b=document.getElementById('btn-load');if(b){b.textContent='📋 Cargar Lista';b.disabled=false;}}
}
function renderListaC(){
  const lc=document.getElementById('lc');if(!lc)return;
  const P=lista.filter(a=>a.est==='P').length,T=lista.filter(a=>a.est==='T').length,F=lista.filter(a=>a.est==='F').length,J=lista.filter(a=>a.est==='J').length;
  const smsg=puedeSync()?'<div class="sync-bar on">⚡ <strong>Sincronización activa</strong> — alumnos ✅/⏰ sin registro previo se añadirán al sistema general.</div>':'<div class="sync-bar off">🔒 <strong>Solo registro interno</strong> — el horario de sincronización ya cerró.</div>';
  lc.innerHTML=`${smsg}
    <div style="background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:10px;padding:.7rem 1rem;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.35rem;">
      <div style="font-size:.72rem;color:rgba(255,255,255,.7);">Grupo: <strong style="color:var(--yellow);">${gsel.grado}° ${gsel.grupo}</strong> · <strong style="color:var(--yellow);">${docNom}</strong></div>
      <div style="font-size:.62rem;color:rgba(255,255,255,.45);">📅 ${hoy()} · ${hora()}</div>
    </div>
    <div class="lh"><div class="lh-title">📋 ${lista.length} alumnos</div>
      <div class="badges"><span class="bdg bp" id="c-p">✅ ${P}</span><span class="bdg bt" id="c-t">⏰ ${T}</span><span class="bdg bf" id="c-f">❌ ${F}</span>${J>0?`<span class="bdg bj" id="c-j">📝 ${J}</span>`:''}</div>
    </div>
    <div class="abar">
      <div class="bwrap"><span class="bico">🔍</span><input class="binp" id="b-lista" placeholder="Buscar alumno..." oninput="filtrarLista()"></div>
      <button class="btn-all" onclick="marcarTodos()">✅ Todos</button>
    </div>
    <div id="al-lista">${lista.map((a,i)=>htmlAl(a,i)).join('')}</div>
    <div class="afin"><button class="btn-save" id="btn-save">💾 Guardar Lista</button><button class="btn-new" onclick="nuevaLista()">🔄 Nueva</button></div>`;
  document.getElementById('btn-save').addEventListener('click',guardarLista);
}
function htmlAl(a,i){
  const sc={P:'sP',T:'sT',F:'sF',J:'sJ'}[a.est]||'';
  const cE=mapE(a.raw);
  let dc,dl,dco;
  if(!a.raw){dc='dF';dl='Sin registro';dco='color:var(--ruby)';}
  else if(cE==='P'){dc='dP';dco='color:var(--emerald)';dl=a.regPor==='TS'?'👩‍💼 T. Social':a.regPor==='Docente'?'📋 Docente':'📡 Escáner';}
  else if(cE==='T'){dc='dT';dco='color:var(--amber)';dl=a.regPor==='TS'?'👩‍💼 Retardo — T. Social':'📡 Llegó tarde';}

  const todas=window._mgTodas||[];
  const sesM=todas.filter(r=>(r.fecha||'').startsWith(mes));
  const stM={};sesM.forEach(r=>{(r.alumnos||[]).forEach(a=>{const nk=san(norm(a.nombre));if(!stM[nk])stM[nk]={nombre:a.nombre,P:0,T:0,F:0,J:0,total:0};stM[nk][a.estatusMaestro]=(stM[nk][a.estatusMaestro]||0)+1;stM[nk].total++;});});
  const al=Object.values(stM).sort((a,b)=>b.F-a.F);
  const stEl=document.getElementById('sem-tit');const swEl=document.getElementById('sem-wrap');
  if(stEl)stEl.textContent=`Semáforo — ${mesNom(mes)}`;
  if(swEl)swEl.innerHTML=al.length?al.map(a=>{const p=calcPct(a.P,a.T,a.total);const dc=dotColor(p);const cb=bgColor(p);const nots=(notasC[san(norm(a.nombre))]||[]).length;return`<div class="sem-item" onclick="irAlAlumno('${a.nombre.replace(/'/g,"\\'")}')"><div class="sem-dot ${dc}"></div><div style="flex:1;"><div class="sem-nom">${(a.nombre||'').toUpperCase()}</div><div class="sem-meta">P:${a.P} T:${a.T} F:${a.F} J:${a.J}${nots?' · 📝'+nots:''}</div></div><span class="sem-pct" style="${cb}">${p}%</span><span style="color:var(--slate2);font-size:.8rem;margin-left:.3rem;">›</span></div>`;}).join(''):`<div style="font-size:.78rem;color:var(--slate2);padding:.5rem 0;">Sin datos para ${mesNom(mes)}.</div>`;
};
window.irAlAlumno=function(nombre){ir('alumno').then(()=>{setTimeout(()=>{const inp=document.getElementById('sg-inp');if(inp){inp.value=norm(nombre).slice(0,15);buscarAlumno();}},200);});};
async function recalcStats(){
  if(!gsel.turno)return;statsC={};
  try{const snap=await dbGet(`escuelas/${escAct}/listas-maestro`);if(snap.exists()){snap.forEach(fS=>{fS.forEach(gS=>{gS.forEach(sS=>{const r=sS.val();if(r.maestro!==docNom||r.turno!==gsel.turno||String(r.grado)!==String(gsel.grado)||r.grupo!==gsel.grupo)return;(r.alumnos||[]).forEach(a=>{const nk=san(norm(a.nombre));if(!statsC[nk])statsC[nk]={nombre:a.nombre,P:0,T:0,F:0,J:0,total:0};statsC[nk][a.estatusMaestro]=(statsC[nk][a.estatusMaestro]||0)+1;statsC[nk].total++;});});});});}}catch(e){}
}
// ══ MIS LISTAS ══
async function renderVista_mislistas(){
  const m=document.getElementById('main');
  try{
    const snap=await dbGet(`escuelas/${escAct}/listas-maestro`);const hist=[];
    if(snap.exists()){snap.forEach(fS=>{fS.forEach(gS=>{gS.forEach(sS=>{const r=sS.val();if(r.maestro===docNom)hist.push(r);});});});}
    hist.sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
    if(!hist.length){m.innerHTML='<div class="empty"><div class="eico">📂</div><p>Sin listas guardadas aún</p><small>Guarda una lista desde Lista para verla aquí.</small></div>';return;}
    const IE={P:'✅',T:'⏰',F:'❌',J:'📝'};const CE={P:'color:#166534',T:'color:#92400E',F:'color:#991B1B',J:'color:#164E63'};const LE={P:'Presente',T:'Retardo',F:'Falta',J:'Justificado'};
    m.innerHTML=`<div style="font-size:.9rem;font-weight:900;color:var(--navy);margin-bottom:.65rem;">📂 Mis Listas — ${hist.length} sesión${hist.length!==1?'es':''}</div>
      ${hist.slice(0,50).map((r,i)=>{const P=r.alumnos?.filter(a=>a.estatusMaestro==='P').length||0;const T=r.alumnos?.filter(a=>a.estatusMaestro==='T').length||0;const F=r.alumnos?.filter(a=>a.estatusMaestro==='F').length||0;const J=r.alumnos?.filter(a=>a.estatusMaestro==='J').length||0;const tot=r.alumnos?.length||1;const p=calcPct(P,T,tot);const col=p>=85?'color:var(--emerald)':p>=70?'color:var(--amber)':'color:var(--ruby)';
      return`<div class="hl-card"><div class="hl-hdr" onclick="toggleHL(${i})"><div><div class="hl-grp">${r.grupoDisplay||''}</div><div class="hl-fec">📅 ${r.fecha} · ⏰ ${r.hora}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:.28rem;"><div style="display:flex;gap:.28rem;"><span class="bdg bp">✅${P}</span><span class="bdg bt">⏰${T}</span><span class="bdg bf">❌${F}</span>${J>0?`<span class="bdg bj">📝${J}</span>`:''}</div><span style="font-size:.62rem;font-weight:800;${col}">${p}% asistencia</span></div></div>
      <div class="hl-body" id="hl-${i}">${(r.alumnos||[]).map(a=>`<div class="hl-row"><div class="hl-n">${(a.nombre||'').toUpperCase()}</div><div class="hl-e" style="${CE[a.estatusMaestro]||''}">${IE[a.estatusMaestro]||'—'} ${LE[a.estatusMaestro]||'—'}</div></div>`).join('')}</div></div>`;}).join('')}`;
  }catch(e){m.innerHTML='<div class="empty"><div class="eico">⚠️</div><p>Error al cargar.</p></div>';}
}
window.toggleHL=function(i){document.getElementById(`hl-${i}`)?.classList.toggle('open');};
</script>
