<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LudoAssist · Docente</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a6b3a;--green2:#2d8a52;--green3:#e8f5ed;
  --navy:#0A192F;--navy2:#1E293B;--slate:#334155;--slate2:#64748B;
  --emerald:#10B981;--ruby:#EF4444;--amber:#F59E0B;--cyan:#06B6D4;
  --purple:#8B5CF6;--wa:#25D366;--yellow:#FFD600;
  --light:#F0F7F2;--white:#FFFFFF;--border:#CBD5E1;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:var(--light);color:var(--slate);min-height:100dvh;display:flex;flex-direction:column;}

/* ── LOGIN ── */
#screen-login{position:fixed;inset:0;background:linear-gradient(160deg,#1a4a2a,#0d2b1a 55%,#071a10);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:1.5rem;gap:1rem;overflow:hidden;}
#screen-login.hidden{display:none;}
#screen-login::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(255,255,255,.04) 38px,rgba(255,255,255,.04) 40px),repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(255,255,255,.02) 38px,rgba(255,255,255,.02) 40px);pointer-events:none;}
.util-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.util{position:absolute;font-size:1.5rem;animation:flotar linear infinite;opacity:.45;}
.util:nth-child(1){left:6%;animation-duration:13s;}
.util:nth-child(2){left:18%;animation-duration:11s;animation-delay:2s;}
.util:nth-child(3){left:30%;animation-duration:16s;animation-delay:.5s;}
.util:nth-child(4){left:43%;animation-duration:12s;animation-delay:3s;}
.util:nth-child(5){left:57%;animation-duration:15s;animation-delay:1s;}
.util:nth-child(6){left:70%;animation-duration:10s;animation-delay:4s;}
.util:nth-child(7){left:82%;animation-duration:14s;animation-delay:1.5s;}
.util:nth-child(8){left:91%;animation-duration:17s;animation-delay:2.5s;}
@keyframes flotar{0%{transform:translateY(110vh) rotate(0deg);opacity:.45;}100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}}
.login-logo{position:relative;z-index:2;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:.85rem 1.4rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;backdrop-filter:blur(8px);animation:fadeUp .6s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.login-logo-ico{font-size:2.6rem;line-height:1;}
.login-logo-app{font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--yellow);line-height:1;}
.login-logo-rol{font-size:.62rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:3px;font-weight:700;}
.login-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:1.4rem;width:100%;max-width:360px;display:flex;flex-direction:column;gap:.9rem;backdrop-filter:blur(12px);position:relative;z-index:2;animation:fadeUp .6s .15s ease both;}
.lbl{font-size:.65rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:.3rem;display:block;}
.inp-wrap{position:relative;}
.inp-ico{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;}
.inp{width:100%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);border-radius:9px;padding:.78rem 1rem .78rem 2.4rem;color:var(--white);font-size:.95rem;font-weight:700;outline:none;transition:border .3s;font-family:'Nunito',sans-serif;}
.inp.center{letter-spacing:2px;text-transform:uppercase;text-align:center;padding-left:1rem;}
.inp:focus{border-color:var(--yellow);}
.inp::placeholder{color:rgba(255,255,255,.3);font-size:.82rem;font-weight:600;letter-spacing:0;}
.btn-login{width:100%;padding:.95rem;background:linear-gradient(135deg,var(--yellow),#ffaa00);color:#1a3a00;border:none;border-radius:9px;font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(255,214,0,.35);transition:transform .2s;}
.btn-login:active{transform:scale(.97);}
.btn-login:disabled{background:rgba(255,255,255,.2);color:rgba(255,255,255,.4);box-shadow:none;}
.login-err{color:#ff8a80;font-size:.78rem;text-align:center;font-weight:700;min-height:16px;}
.login-hint{font-size:.68rem;color:rgba(255,255,255,.35);text-align:center;}

/* ── HEADER ── */
header{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.2);flex-shrink:0;position:sticky;top:0;z-index:500;}
.hdr-brand{font-family:'Fredoka One',cursive;font-size:1rem;letter-spacing:.4px;}
.hdr-brand span{color:var(--yellow);}
.hdr-info{font-size:.58rem;color:rgba(255,255,255,.68);font-weight:700;}
.hdr-right{display:flex;align-items:center;gap:.5rem;}
.hdr-sync-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:.2rem .6rem;font-size:.62rem;font-weight:800;color:var(--white);display:none;}
.hdr-sync-badge.activo{display:block;background:rgba(16,185,129,.3);border-color:var(--emerald);}
.hdr-sync-badge.inactivo{display:block;background:rgba(239,68,68,.25);border-color:var(--ruby);}
.btn-salir{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:var(--white);padding:.3rem .6rem;border-radius:6px;cursor:pointer;font-size:.65rem;font-weight:700;}

/* ── MAIN ── */
main{flex:1;overflow-y:auto;padding:1rem 1rem 6rem;max-width:600px;margin:0 auto;width:100%;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease;}

/* ── CHIPS ESCUELA ── */
.escuelas-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.65rem;}
.chip-esc{background:var(--white);border:2px solid var(--border);border-radius:20px;padding:.28rem .85rem;font-size:.7rem;font-weight:800;color:var(--slate);cursor:pointer;transition:all .2s;}
.chip-esc.active{background:var(--green3);border-color:var(--green);color:var(--green);}
.btn-add-esc{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.22));border:1.5px solid rgba(139,92,246,.4);color:#A78BFA;border-radius:9px;padding:.6rem 1rem;font-size:.78rem;font-weight:800;cursor:pointer;width:100%;margin-bottom:.75rem;font-family:'Nunito',sans-serif;transition:transform .2s;}
.btn-add-esc:active{transform:scale(.98);}

/* ── SELECTOR ── */
.selector-card{background:var(--white);border-radius:12px;padding:.9rem 1rem;margin-bottom:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid var(--green);}
.selector-label{font-size:.62rem;color:var(--slate2);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:.65rem;}
.sel-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-bottom:.65rem;}
.sel{background:var(--light);border:1.5px solid var(--border);border-radius:8px;padding:.6rem .45rem;color:var(--navy);font-size:.8rem;width:100%;outline:none;font-family:'Nunito',sans-serif;font-weight:700;}
.sel:focus{border-color:var(--green);}
.btn-cargar{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:9px;padding:.75rem;font-size:.88rem;font-weight:900;cursor:pointer;width:100%;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(26,107,58,.3);transition:transform .2s;}
.btn-cargar:active{transform:scale(.98);}
.btn-cargar:disabled{background:var(--slate2);box-shadow:none;}

/* ── SYNC INFO ── */
.sync-info{border-radius:10px;padding:.65rem .9rem;margin-bottom:.75rem;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:.5rem;}
.sync-info.activo{background:#DCFCE7;border:1.5px solid var(--emerald);color:#166534;}
.sync-info.inactivo{background:#FEE2E2;border:1.5px solid var(--ruby);color:#991B1B;}

/* ── LISTA ── */
.lista-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.lista-titulo{font-size:.92rem;font-weight:900;color:var(--navy);}
.badges-row{display:flex;gap:.35rem;}
.badge{font-size:.62rem;font-weight:800;padding:.18rem .45rem;border-radius:8px;}
.b-p{background:#DCFCE7;color:#166534;}
.b-t{background:#FEF9C3;color:#854D0E;}
.b-f{background:#FEE2E2;color:#991B1B;}
.b-j{background:#CFFAFE;color:#164E63;}
.acciones-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem;gap:.5rem;}
.busq-wrap{position:relative;flex:1;}
.busq-inp{width:100%;padding:.6rem .6rem .6rem 2.1rem;border:1.5px solid var(--border);border-radius:9px;font-size:.82rem;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;background:var(--white);}
.busq-inp:focus{border-color:var(--green);}
.busq-ico{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none;}
.btn-todos{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(16,185,129,.28));border:1.5px solid var(--emerald);color:#065F46;border-radius:9px;padding:.6rem .85rem;font-size:.75rem;font-weight:800;cursor:pointer;white-space:nowrap;font-family:'Nunito',sans-serif;}
.btn-todos:active{transform:scale(.97);}

/* ── TARJETA ALUMNO ── */
.al-card{background:var(--white);border-radius:10px;padding:.7rem .9rem;margin-bottom:.45rem;display:flex;align-items:flex-start;gap:.65rem;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--border);transition:border-color .2s;}
.al-card.s-P{border-left-color:var(--emerald);}
.al-card.s-T{border-left-color:var(--amber);}
.al-card.s-F{border-left-color:var(--ruby);}
.al-card.s-J{border-left-color:var(--cyan);}
.al-card.hidden{display:none;}
.al-num{font-size:.62rem;font-weight:800;color:var(--slate2);min-width:18px;text-align:center;padding-top:.1rem;flex-shrink:0;}
.al-info{flex:1;min-width:0;}
.al-nombre{font-size:.8rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.2px;line-height:1.3;}
.al-dot-row{display:flex;align-items:center;gap:.3rem;margin-top:.2rem;flex-wrap:wrap;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-P{background:var(--emerald);}
.dot-T{background:var(--amber);}
.dot-F{background:var(--ruby);}
.dot-J{background:var(--cyan);}
.dot-lbl{font-size:.6rem;font-weight:800;}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:5px;padding:.15rem .45rem;font-size:.6rem;font-weight:800;margin-top:.2rem;line-height:1.3;}
.chip-just{background:#CFFAFE;color:#164E63;border:1px solid #A5F3FC;}
.chip-ret{background:#FEF9C3;color:#92400E;border:1px solid #FDE68A;}
.chip-par{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;}
.chip-sync{background:#DCFCE7;color:#166534;border:1px solid #86EFAC;}
.chip-alerta{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;}
.chip-nota{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE;cursor:pointer;}

/* Botones estatus */
.btns-est{display:flex;gap:.22rem;flex-shrink:0;}
.be{border:2px solid transparent;border-radius:7px;padding:.28rem .3rem;font-size:.88rem;cursor:pointer;opacity:.45;transition:all .2s;min-width:32px;min-height:32px;text-align:center;line-height:1;}
.be.on{opacity:1;transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.15);}
.be-p{background:rgba(16,185,129,.12);}.be-p.on{background:var(--emerald);border-color:var(--emerald);}
.be-t{background:rgba(245,158,11,.12);}.be-t.on{background:var(--amber);border-color:var(--amber);}
.be-f{background:rgba(239,68,68,.12);}.be-f.on{background:var(--ruby);border-color:var(--ruby);}
.be-j{background:rgba(6,182,212,.12);}.be-j.on{background:var(--cyan);border-color:var(--cyan);}

/* Panel nota inline */
.nota-panel{display:none;margin-top:.55rem;padding-top:.55rem;border-top:1px dashed var(--border);}
.nota-panel.open{display:block;}
.nota-txt{width:100%;padding:.5rem .65rem;border:1.5px solid #DDD6FE;border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;color:var(--navy);resize:none;height:60px;outline:none;}
.nota-txt:focus{border-color:var(--purple);}
.nota-btns{display:flex;gap:.4rem;margin-top:.35rem;}
.btn-nota-ok{background:var(--purple);color:white;border:none;border-radius:7px;padding:.38rem .8rem;font-size:.72rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}
.btn-nota-x{background:var(--light);border:1px solid var(--border);color:var(--slate);border-radius:7px;padding:.38rem .7rem;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.notas-prev{margin-bottom:.4rem;}
.nota-prev-item{background:#F5F3FF;border-left:3px solid var(--purple);border-radius:0 7px 7px 0;padding:.38rem .6rem;margin-bottom:.3rem;font-size:.72rem;color:#3B0764;line-height:1.45;}
.nota-prev-fecha{font-size:.6rem;font-weight:800;color:#7C3AED;margin-bottom:.1rem;}

/* Acciones finales */
.acciones-fin{margin-top:1rem;display:flex;gap:.6rem;}
.btn-guardar{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:10px;padding:.88rem 1.1rem;font-size:.88rem;font-weight:900;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;box-shadow:0 3px 10px rgba(26,107,58,.3);}
.btn-guardar:active{transform:scale(.98);}
.btn-nueva{background:var(--light);border:1.5px solid var(--border);color:var(--slate);border-radius:10px;padding:.88rem 1.1rem;font-size:.82rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}

/* ── VISTA ALUMNOS ── */
.search-grande{position:relative;margin-bottom:.85rem;}
.search-grande input{width:100%;padding:.85rem .85rem .85rem 2.6rem;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;background:var(--white);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.search-grande input:focus{border-color:var(--green);}
.search-grande .sg-ico{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none;}
.al-list-item{background:var(--white);border-radius:10px;padding:.75rem 1rem;margin-bottom:.45rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;border-left:4px solid var(--border);transition:all .2s;}
.al-list-item:active{transform:scale(.98);}
.al-list-nombre{font-size:.82rem;font-weight:800;color:var(--navy);text-transform:uppercase;}
.al-list-meta{font-size:.65rem;color:var(--slate2);margin-top:.15rem;}
.al-list-badges{display:flex;gap:.3rem;align-items:center;}

/* Panel detalle alumno */
.detalle-panel{display:none;background:var(--white);border-radius:12px;padding:1rem;margin-bottom:.85rem;box-shadow:0 2px 10px rgba(0,0,0,.1);border-top:3px solid var(--green);}
.detalle-panel.open{display:block;animation:fadeIn .2s ease;}
.det-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.85rem;}
.det-nombre{font-size:1rem;font-weight:900;color:var(--navy);}
.det-sub{font-size:.65rem;color:var(--slate2);margin-top:.2rem;}
.btn-det-x{background:none;border:none;font-size:1.2rem;color:var(--slate2);cursor:pointer;padding:.2rem .4rem;}
.det-stats-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem;}
.det-stat{border-radius:8px;padding:.35rem .6rem;font-size:.7rem;font-weight:800;text-align:center;}
.det-sec-title{font-size:.65rem;font-weight:900;color:var(--slate2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.5rem;display:flex;align-items:center;gap:.35rem;}
.det-sec{margin-bottom:.85rem;}
.asist-row{display:flex;justify-content:space-between;align-items:center;padding:.38rem .55rem;border-radius:7px;margin-bottom:.28rem;font-size:.78rem;}
.asist-row:nth-child(odd){background:#F8FAFC;}
.asist-fecha{font-weight:700;color:var(--navy);}
.asist-est{font-weight:800;font-size:.72rem;}
.nota-det-item{background:#F5F3FF;border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:.5rem .7rem;margin-bottom:.35rem;}
.nota-det-fecha{font-size:.6rem;font-weight:800;color:#7C3AED;margin-bottom:.15rem;}
.nota-det-txt{font-size:.8rem;color:var(--navy);line-height:1.5;}
.btn-wa-padre{width:100%;padding:.88rem;background:var(--wa);color:white;border:none;border-radius:10px;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;font-family:'Nunito',sans-serif;box-shadow:0 3px 12px rgba(37,211,102,.3);}
.btn-wa-padre:active{transform:scale(.97);}

/* ── STATS ── */
.stats-cards{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.85rem;}
.s-card{background:var(--white);border-radius:11px;padding:.8rem;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.s-num{font-size:1.5rem;font-weight:900;color:var(--navy);}
.s-lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;color:var(--slate2);margin-top:.1rem;}
.sem-item{background:var(--white);border-radius:9px;padding:.6rem .8rem;margin-bottom:.38rem;display:flex;align-items:center;gap:.65rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.sem-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.sem-verde{background:var(--emerald);}
.sem-amarillo{background:var(--amber);}
.sem-rojo{background:var(--ruby);}
.sem-nombre{flex:1;font-size:.78rem;font-weight:800;color:var(--navy);}
.sem-meta{font-size:.6rem;color:var(--slate2);}
.sem-pct{font-size:.72rem;font-weight:900;padding:.18rem .4rem;border-radius:8px;}

/* ── HISTORIAL ── */
.hist-card{background:var(--white);border-radius:10px;margin-bottom:.5rem;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.hist-hdr{display:flex;justify-content:space-between;align-items:center;padding:.78rem .9rem;cursor:pointer;border-left:4px solid var(--green);}
.hist-grupo{font-size:.9rem;font-weight:900;color:var(--navy);}
.hist-fecha{font-size:.65rem;color:var(--slate2);margin-top:.12rem;}
.hist-body{display:none;border-top:1px solid var(--border);}
.hist-body.open{display:block;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:.42rem .9rem;border-bottom:1px solid #F1F5F9;font-size:.8rem;}
.hist-row:last-child{border-bottom:none;}
.hist-nom{color:var(--navy);font-weight:700;text-transform:uppercase;font-size:.75rem;}
.hist-est{font-size:.72rem;font-weight:800;}

/* ── MODAL AGREGAR ESCUELA ── */
#modal-esc{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:600;}
#modal-esc.show{display:flex;}
.modal-box{background:var(--white);border-radius:20px 20px 0 0;padding:1.4rem;width:100%;max-width:480px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:.95rem;font-weight:900;color:var(--navy);margin-bottom:.85rem;}
.modal-inp{background:var(--light);border:1.5px solid var(--border);border-radius:9px;padding:.75rem 1rem;color:var(--navy);font-size:1rem;font-weight:700;width:100%;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none;margin-bottom:.65rem;font-family:'Nunito',sans-serif;}
.modal-inp:focus{border-color:var(--green);}
.modal-err{color:var(--ruby);font-size:.75rem;text-align:center;margin-bottom:.45rem;font-weight:700;min-height:15px;}
.modal-btns{display:flex;gap:.6rem;}
.btn-mok{background:linear-gradient(135deg,var(--green),var(--green2));color:var(--white);border:none;border-radius:9px;padding:.78rem;font-size:.88rem;font-weight:900;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;}
.btn-mcancel{background:var(--light);border:1.5px solid var(--border);color:var(--slate);border-radius:9px;padding:.78rem;font-size:.88rem;font-weight:700;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;}

/* ── TOAST ── */
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--white);padding:.6rem 1.3rem;border-radius:50px;font-size:.8rem;font-weight:800;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── EMPTY / LOADER ── */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--slate2);}
.empty-ico{font-size:2.8rem;margin-bottom:.65rem;}
.empty p{font-size:.85rem;font-weight:700;color:var(--slate);}
.empty small{font-size:.75rem;color:var(--slate2);margin-top:.3rem;display:block;}
.loader{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── NAV ── */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:2px solid var(--border);display:flex;z-index:490;box-shadow:0 -2px 10px rgba(0,0,0,.07);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.55rem .35rem;cursor:pointer;color:var(--slate2);font-size:.54rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;gap:.12rem;border:none;background:transparent;font-family:'Nunito',sans-serif;}
.nav-btn .ni{font-size:1.2rem;}
.nav-btn.active{color:var(--green);}
</style>
</head>

<script type="module">
import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, get, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const FB = {
  apiKey:"AIzaSyD_sJOOY4wQY_473JGj0FXGHm2PzHMC2u0",
  authDomain:"ludoasistencia.firebaseapp.com",
  databaseURL:"https://ludoasistencia-default-rtdb.firebaseio.com",
  projectId:"ludoasistencia",
  storageBucket:"ludoasistencia.firebasestorage.app",
  messagingSenderId:"738361802611",
  appId:"1:738361802611:web:cb13956f002a0e74844f06"
};
const db = getDatabase(initializeApp(FB));
const dbGet  = p => get(ref(db, p));
const dbPush = (p,d) => push(ref(db, p), d);

// ══════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════
const SK = { esc:'ld_escuelas', nom:'ld_nombre', act:'ld_activa' };
let escuelas      = JSON.parse(localStorage.getItem(SK.esc)||'[]');
let nombreDoc     = localStorage.getItem(SK.nom)||'';
let escActiva     = localStorage.getItem(SK.act)||'';
let estructura    = {};
let lista         = [];   // alumnos cargados para pasar lista
let grupoSel      = { turno:'', grado:'', grupo:'' };
let notasCache    = {};   // sanitizar(nombre) → [{texto,fecha,hora}]
let statsCache    = {};   // sanitizar(nombre) → {P,T,F,J,total}
let histCache     = [];   // registros guardados del docente
let vistaActual   = 'lista';
let alumnoDetalle = null; // alumno abierto en vista Alumnos

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
function hoy(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function p2(n){ return String(n).padStart(2,'0'); }
function hora(){ return new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
function san(s){ return (s||'').replace(/[.#$[\]/]/g,'_'); }
function norm(n){ return (n||'').replace(/^\[ [AM] \] /,'').toUpperCase().trim(); }
function mapEst(e){
  if(!e) return 'F';
  const v=e.toLowerCase();
  if(v==='asistencia') return 'P';
  if(v==='retardo') return 'T';
  if(v.startsWith('justificado')) return 'J';
  return 'F';
}
function motivo(e){ if(!e||!e.toLowerCase().startsWith('justificado')) return null; const i=e.indexOf(' - '); return i>=0?e.slice(i+3).trim():null; }
function fechaLeg(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']; const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; const dt=new Date(y,m-1,d); return `${dias[dt.getDay()]} ${d} ${meses[m-1]}`; }

// ── Verificar si la hora actual permite sincronizar con asistencias/ ──
// Matutino:   hasta 08:00
// Vespertino: hasta 15:00
function puedeSync(){
  const t = grupoSel.turno.toLowerCase();
  const ahora = new Date();
  const min = ahora.getHours()*60 + ahora.getMinutes();
  if(t.includes('mat'))  return min <= 8*60;    // ≤ 08:00
  if(t.includes('vesp')) return min <= 15*60;   // ≤ 15:00
  return false;
}

function actualizarSyncBadge(){
  const badge = document.getElementById('sync-badge');
  if(!grupoSel.turno){ badge.className='hdr-sync-badge'; return; }
  if(puedeSync()){
    badge.className='hdr-sync-badge activo';
    badge.textContent='⚡ Sync activo';
  } else {
    badge.className='hdr-sync-badge inactivo';
    badge.textContent='🔒 Solo interno';
  }
}

// ══════════════════════════════════════════════
// TOAST (robusto para móvil)
// ══════════════════════════════════════════════
let _tt=null;
function toast(msg){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  if(_tt) clearTimeout(_tt);
  _tt=setTimeout(()=>{ el.classList.remove('show'); _tt=null; },2800);
}
function clearToast(){ const el=document.getElementById('toast'); if(el) el.classList.remove('show'); if(_tt){ clearTimeout(_tt); _tt=null; } }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') clearToast(); });
window.addEventListener('pageshow', clearToast);
window.addEventListener('focus', clearToast);

// ══════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════
document.getElementById('btn-login').addEventListener('click', async()=>{
  const cod  = document.getElementById('l-codigo').value.trim().toLowerCase();
  const nom  = document.getElementById('l-nombre').value.trim();
  const errEl= document.getElementById('l-err');
  errEl.textContent='';
  if(!cod){ errEl.textContent='Ingresa el código de tu escuela.'; return; }
  if(!nom){ errEl.textContent='Ingresa tu nombre.'; return; }
  const btn=document.getElementById('btn-login');
  btn.textContent='⏳ Verificando...'; btn.disabled=true;
  try{
    const snap=await dbGet(`escuelas/${cod}/configuracion/perfil`);
    if(!snap.exists()){ errEl.textContent='❌ Código no encontrado.'; return; }
    const p=snap.val();
    if(p.activa===false){ errEl.textContent='🔒 Escuela bloqueada.'; return; }
    if(!escuelas.find(e=>e.cod===cod)){
      escuelas.push({cod, nombre:p.nombreEscuela||cod.toUpperCase()});
      localStorage.setItem(SK.esc, JSON.stringify(escuelas));
    }
    nombreDoc=nom; localStorage.setItem(SK.nom,nom);
    escActiva=cod; localStorage.setItem(SK.act,cod);
    arrancar();
  }catch(e){ errEl.textContent='⚠️ Sin conexión.'; }
  finally{ btn.textContent='✅ Entrar'; btn.disabled=false; }
});
document.getElementById('l-codigo').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('l-nombre').focus(); });
document.getElementById('l-nombre').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-login').click(); });
document.getElementById('btn-salir').addEventListener('click', ()=>{
  if(!confirm('¿Cerrar sesión?')) return;
  localStorage.removeItem(SK.nom); localStorage.removeItem(SK.act);
  location.reload();
});

async function arrancar(){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('hdr-info').textContent=`👤 ${nombreDoc}`;
  await cargarEstructura();
  irVista('lista');
}
if(escuelas.length&&nombreDoc&&escActiva) arrancar();

// ══════════════════════════════════════════════
// CHIPS + MODAL ESCUELA
// ══════════════════════════════════════════════
function renderChips(cont){
  cont.innerHTML=escuelas.map(e=>
    `<div class="chip-esc ${e.cod===escActiva?'active':''}" onclick="cambiarEsc('${e.cod}')">🏫 ${e.nombre}</div>`
  ).join('');
}
window.cambiarEsc=async function(cod){
  escActiva=cod; localStorage.setItem(SK.act,cod);
  lista=[]; grupoSel={turno:'',grado:'',grupo:''};
  await cargarEstructura(); irVista('lista'); toast('🏫 Escuela cambiada');
};

document.getElementById('m-cancel').addEventListener('click',()=>document.getElementById('modal-esc').classList.remove('show'));
document.getElementById('m-ok').addEventListener('click',async()=>{
  const cod=document.getElementById('m-codigo').value.trim().toLowerCase();
  const errEl=document.getElementById('m-err'); errEl.textContent='';
  if(!cod){ errEl.textContent='Ingresa el código.'; return; }
  if(escuelas.find(e=>e.cod===cod)){ errEl.textContent='Ya está agregada.'; return; }
  document.getElementById('m-ok').textContent='⏳...';
  try{
    const snap=await dbGet(`escuelas/${cod}/configuracion/perfil`);
    if(!snap.exists()){ errEl.textContent='❌ No encontrada.'; return; }
    const p=snap.val();
    if(p.activa===false){ errEl.textContent='🔒 Bloqueada.'; return; }
    escuelas.push({cod,nombre:p.nombreEscuela||cod.toUpperCase()});
    localStorage.setItem(SK.esc,JSON.stringify(escuelas));
    escActiva=cod; localStorage.setItem(SK.act,cod);
    document.getElementById('modal-esc').classList.remove('show');
    await cargarEstructura(); irVista('lista'); toast('✅ Escuela agregada');
  }catch(e){ errEl.textContent='⚠️ Sin conexión.'; }
  finally{ document.getElementById('m-ok').textContent='✅ Verificar'; }
});

// ══════════════════════════════════════════════
// ESTRUCTURA
// ══════════════════════════════════════════════
async function cargarEstructura(){
  try{
    const snap=await dbGet(`escuelas/${escActiva}/directorio`);
    estructura={};
    if(snap.exists()){
      Object.keys(snap.val()).forEach(clave=>{
        const pts=clave.split('-'); if(pts.length<3) return;
        const [turno,grado,...grp]=pts; const grupo=grp.join('-');
        if(!estructura[turno]) estructura[turno]={};
        if(!estructura[turno][grado]) estructura[turno][grado]=[];
        if(!estructura[turno][grado].includes(grupo)) estructura[turno][grado].push(grupo);
      });
      Object.keys(estructura).forEach(t=>Object.keys(estructura[t]).forEach(g=>estructura[t][g].sort()));
    }
  }catch(e){ toast('⚠️ Error al cargar estructura.'); }
}

// ══════════════════════════════════════════════
// VISTA: LISTA
// ══════════════════════════════════════════════
function renderVista_lista(){
  const cont=document.getElementById('main-content');

  // Detectar turno automáticamente
  const horaNum=new Date().getHours();
  const turnosKeys=Object.keys(estructura);
  let turnoAuto='';
  if(horaNum<13) turnoAuto=turnosKeys.find(t=>t.toLowerCase().includes('mat'))||turnosKeys[0]||'';
  else turnoAuto=turnosKeys.find(t=>t.toLowerCase().includes('vesp'))||turnosKeys[0]||'';

  let selectorHTML=`
    <div class="escuelas-bar" id="chips-cont"></div>
    <button class="btn-add-esc" id="btn-add-esc">➕ Agregar otra escuela</button>
    <div class="selector-card">
      <div class="selector-label">Seleccionar grupo para pasar lista</div>
      <div class="sel-row">
        <select class="sel" id="s-turno"><option value="">Turno</option>
          ${turnosKeys.map(t=>`<option value="${t}" ${t===turnoAuto?'selected':''}>${t}</option>`).join('')}
        </select>
        <select class="sel" id="s-grado"><option value="">Grado</option></select>
        <select class="sel" id="s-grupo"><option value="">Grupo</option></select>
      </div>
      <button class="btn-cargar" id="btn-cargar">📋 Cargar Lista</button>
    </div>
    <div id="lista-contenido"></div>
  `;
  cont.innerHTML=selectorHTML;

  renderChips(document.getElementById('chips-cont'));
  document.getElementById('btn-add-esc').addEventListener('click',()=>document.getElementById('modal-esc').classList.add('show'));

  const selTurno=document.getElementById('s-turno');
  const selGrado=document.getElementById('s-grado');
  const selGrupo=document.getElementById('s-grupo');

  function llenarGrados(){
    const turno=selTurno.value;
    selGrado.innerHTML='<option value="">Grado</option>';
    selGrupo.innerHTML='<option value="">Grupo</option>';
    if(!turno) return;
    Object.keys(estructura[turno]||{}).sort((a,b)=>Number(a)-Number(b)).forEach(g=>{
      selGrado.innerHTML+=`<option value="${g}">${g}° Grado</option>`;
    });
  }
  function llenarGrupos(){
    const turno=selTurno.value, grado=selGrado.value;
    selGrupo.innerHTML='<option value="">Grupo</option>';
    if(!turno||!grado) return;
    (estructura[turno]?.[grado]||[]).forEach(g=>{ selGrupo.innerHTML+=`<option value="${g}">${g}</option>`; });
  }
  selTurno.addEventListener('change', llenarGrados);
  selGrado.addEventListener('change', llenarGrupos);

  // Si había turno preseleccionado, llenar cascada
  if(turnoAuto){ llenarGrados(); }

  document.getElementById('btn-cargar').addEventListener('click', cargarLista);
}

async function cargarLista(){
  const turno=document.getElementById('s-turno')?.value;
  const grado=document.getElementById('s-grado')?.value;
  const grupo=document.getElementById('s-grupo')?.value;
  if(!turno||!grado||!grupo){ toast('⚠️ Selecciona turno, grado y grupo.'); return; }
  grupoSel={turno,grado,grupo};
  actualizarSyncBadge();

  const btn=document.getElementById('btn-cargar');
  btn.textContent='⏳ Cargando...'; btn.disabled=true;

  try{
    // 1. Directorio
    const clave=`${turno}-${grado}-${grupo}`;
    const snapDir=await dbGet(`escuelas/${escActiva}/directorio/${clave}`);
    let nombres=[];
    if(snapDir.exists()){ const v=snapDir.val(); nombres=(Array.isArray(v)?v:Object.values(v)).filter(Boolean).sort(); }
    if(!nombres.length){
      document.getElementById('lista-contenido').innerHTML=`<div class="empty"><div class="empty-ico">📭</div><p>Sin alumnos en este grupo.</p></div>`;
      return;
    }

    // 2. Asistencias del día
    const hoyStr=hoy();
    const snapAs=await dbGet(`escuelas/${escActiva}/asistencias`);
    const asHoy={};
    if(snapAs.exists()){
      snapAs.forEach(ch=>{
        const r=ch.val();
        if(r.fecha!==hoyStr||r.turno!==turno||String(r.grado)!==String(grado)||r.grupoLetra!==grupo) return;
        const n=norm(r.nombre); if(n) asHoy[n]=r;
      });
    }

    // 3. Notas del docente para este grupo
    notasCache={};
    try{
      const snapN=await dbGet(`escuelas/${escActiva}/notas-docente`);
      if(snapN.exists()){
        snapN.forEach(aSnap=>{
          const notas=[]; aSnap.forEach(nSnap=>{ const n=nSnap.val(); if(n.maestro===nombreDoc) notas.push(n); });
          if(notas.length) notasCache[aSnap.key]=notas.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
        });
      }
    }catch(e){}

    // 4. Faltas acumuladas del docente en este grupo
    const faltasAcum={};
    try{
      const snapH=await dbGet(`escuelas/${escActiva}/listas-maestro`);
      if(snapH.exists()){
        snapH.forEach(fSnap=>{
          if(fSnap.key===hoyStr) return;
          fSnap.forEach(gSnap=>{ gSnap.forEach(sSnap=>{
            const r=sSnap.val();
            if(r.maestro!==nombreDoc||r.turno!==turno||String(r.grado)!==String(grado)||r.grupo!==grupo) return;
            (r.alumnos||[]).forEach(a=>{ const n=norm(a.nombre); if(a.estatusMaestro==='F') faltasAcum[n]=(faltasAcum[n]||0)+1; });
          }); });
        });
      }
    }catch(e){}

    // 5. Construir lista
    lista=nombres.map(nombre=>{
      const reg=asHoy[norm(nombre)]||null;
      return {
        nombre, estatusRaw:reg?.estatus||null,
        retiro:reg?.retiroTemprano||false, horaRetiro:reg?.horaRetiro||null,
        horaOriginal:reg?.horaEntradaOriginal||null,
        regPor:reg?.registradoPor||null,
        estatusDoc:mapEst(reg?.estatus),
        faltas:faltasAcum[norm(nombre)]||0,
        syncOk:false,
      };
    });

    renderLista(`${grado}° ${grupo}`);
  }catch(e){ toast('❌ Error cargando lista.'); console.error(e); }
  finally{ btn&&(btn.textContent='📋 Cargar Lista'); btn&&(btn.disabled=false); }
}

function renderLista(grupoDisplay){
  const listaContenido=document.getElementById('lista-contenido');
  if(!listaContenido) return;
  const p=lista.filter(a=>a.estatusDoc==='P').length;
  const t=lista.filter(a=>a.estatusDoc==='T').length;
  const f=lista.filter(a=>a.estatusDoc==='F').length;
  const j=lista.filter(a=>a.estatusDoc==='J').length;

  const syncMsg=puedeSync()
    ?`<div class="sync-info activo">⚡ <strong>Sincronización activa</strong> — los alumnos que marques ✅ o ⏰ sin registro previo aparecerán en el sistema general.</div>`
    :`<div class="sync-info inactivo">🔒 <strong>Solo registro interno</strong> — el horario de sincronización ya pasó. Esta lista es solo para ti.</div>`;

  listaContenido.innerHTML=`
    ${syncMsg}
    <div style="background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:10px;padding:.75rem 1rem;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem;">
      <div style="font-size:.75rem;color:rgba(255,255,255,.7);">Grupo: <strong style="color:var(--yellow);">${grupoDisplay}</strong> · <strong style="color:var(--yellow);">${nombreDoc}</strong></div>
      <div style="font-size:.65rem;color:rgba(255,255,255,.5);">📅 ${hoy()} · ${hora()}</div>
    </div>
    <div class="lista-hdr">
      <div class="lista-titulo">📋 ${lista.length} alumnos</div>
      <div class="badges-row">
        <span class="badge b-p" id="cnt-p">✅ ${p}</span>
        <span class="badge b-t" id="cnt-t">⏰ ${t}</span>
        <span class="badge b-f" id="cnt-f">❌ ${f}</span>
        ${j>0?`<span class="badge b-j" id="cnt-j">📝 ${j}</span>`:''}
      </div>
    </div>
    <div class="acciones-bar">

function htmlAlumno(a,i){
  const sCls={P:'s-P',T:'s-T',F:'s-F',J:'s-J'}[a.estatusDoc]||'';
  const cEsc=mapEst(a.estatusRaw);
  let dotCls,dotLbl,dotColor;
  if(!a.estatusRaw){ dotCls='dot-F';dotLbl='Sin registro';dotColor='color:var(--ruby)'; }
  else if(cEsc==='P'){
    dotCls='dot-P';dotColor='color:var(--emerald)';
    if(a.regPor==='TS') dotLbl='👩‍💼 Trabajadora Social';
    else if(a.regPor==='Docente') dotLbl='📋 Registrado por docente';
    else dotLbl='📡 Escáner';
  } else if(cEsc==='T'){
    dotCls='dot-T';dotColor='color:var(--amber)';
    dotLbl=a.regPor==='TS'?'👩‍💼 Retardo — T. Social':'📡 Llegó tarde';
  } else if(cEsc==='J'){
    dotCls='dot-J';dotColor='color:var(--cyan)';dotLbl='👩‍💼 Justificado — T. Social';
  } else { dotCls='dot-F';dotColor='color:var(--ruby)';dotLbl='Sin registro'; }

  const mot=motivo(a.estatusRaw);
  const nKey=san(norm(a.nombre));
  const notasPrev=notasCache[nKey]||[];

  const chips=[
    mot?`<span class="chip chip-just">📋 ${mot}</span>`:'',
    a.retiro?`<span class="chip chip-ret">🚪${a.horaRetiro?' '+a.horaRetiro:''}</span>`:'',
    (a.horaOriginal&&cEsc==='J')?`<span class="chip chip-par">📥 ${a.horaOriginal}</span>`:'',
    a.syncOk?`<span class="chip chip-sync">🔗 Sincronizado</span>`:'',
    a.faltas>=5?`<span class="chip chip-alerta">⚠️ ${a.faltas} faltas</span>`:'',
    notasPrev.length?`<span class="chip chip-nota" onclick="toggleNota(${i})">📝 ${notasPrev.length} nota${notasPrev.length>1?'s':''}</span>`:'',
  ].filter(Boolean).join('');

  const prevHTML=notasPrev.slice(0,2).map(n=>`
    <div class="nota-prev-item">
      <div class="nota-prev-fecha">📅 ${fechaLeg(n.fecha)} · ${n.hora||''}</div>
      ${n.texto}
    </div>`).join('');

  return `<div class="al-card ${sCls}" id="al-${i}">
    <div class="al-num">${i+1}</div>
    <div class="al-info">
      <div class="al-nombre">${(a.nombre||'').toUpperCase()}</div>
      <div class="al-dot-row">
        <span class="dot ${dotCls}"></span>
        <span class="dot-lbl" style="${dotColor}">${dotLbl}</span>
      </div>
      ${chips?`<div style="display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem;">${chips}</div>`:''}
      <div class="nota-panel" id="np-${i}">
        ${prevHTML?`<div class="notas-prev">${prevHTML}</div>`:''}
        <textarea class="nota-txt" id="nt-${i}" placeholder="Nota privada para este alumno..."></textarea>
        <div class="nota-btns">
          <button class="btn-nota-ok" onclick="guardarNota(${i})">💾 Guardar</button>
          <button class="btn-nota-x" onclick="toggleNota(${i})">✕</button>
          ${notasPrev.length?`<button class="btn-nota-x" style="background:var(--wa);color:white;border-color:var(--wa);" onclick="enviarWAPadre(${i})">📤 WA</button>`:''}
        </div>
      </div>
      <div style="margin-top:.35rem;">
        <span class="chip chip-nota" onclick="toggleNota(${i})" style="background:#EDE9FE;color:#5B21B6;border-color:#C4B5FD;">✏️ Nota</span>
      </div>
    </div>
    <div class="btns-est">
      <button class="be be-p ${a.estatusDoc==='P'?'on':''}" onclick="setEst(${i},'P')">✅</button>
      <button class="be be-t ${a.estatusDoc==='T'?'on':''}" onclick="setEst(${i},'T')">⏰</button>
      <button class="be be-f ${a.estatusDoc==='F'?'on':''}" onclick="setEst(${i},'F')">❌</button>
      <button class="be be-j ${a.estatusDoc==='J'?'on':''}" onclick="setEst(${i},'J')">📝</button>
    </div>
  </div>`;
}

window.filtrarLista=function(){
  const txt=(document.getElementById('busq-lista')?.value||'').toUpperCase();
  document.querySelectorAll('[id^="al-"]').forEach((card,i)=>{
    if(!/^\d+$/.test(card.id.replace('al-',''))) return;
    const n=(lista[parseInt(card.id.replace('al-',''))]?.nombre||'').toUpperCase();
    card.classList.toggle('hidden', txt!==''&&!n.includes(txt));
  });
};
window.marcarTodos=function(){
  lista.forEach((_,i)=>setEst(i,'P'));
  toast('✅ Todos marcados como presentes');
};
window.toggleNota=function(i){ document.getElementById(`np-${i}`)?.classList.toggle('open'); };

window.setEst=function(i,est){
  lista[i].estatusDoc=est;
  const card=document.getElementById(`al-${i}`);
  if(!card) return;
  card.className=`al-card ${{P:'s-P',T:'s-T',F:'s-F',J:'s-J'}[est]||''}`;
  card.querySelectorAll('.be').forEach(b=>b.classList.remove('on'));
  card.querySelector(`.be-${{P:'p',T:'t',F:'f',J:'j'}[est]}`)?.classList.add('on');
  // Actualizar contadores
  ['P','T','F','J'].forEach(e=>{
    const el=document.getElementById(`cnt-${e.toLowerCase()}`);
    if(el) el.textContent=`${{P:'✅',T:'⏰',F:'❌',J:'📝'}[e]} ${lista.filter(a=>a.estatusDoc===e).length}`;
  });
};

window.guardarNota=async function(i){
  const txt=document.getElementById(`nt-${i}`)?.value.trim();
  if(!txt){ toast('⚠️ Escribe algo primero.'); return; }
  const a=lista[i];
  const nKey=san(norm(a.nombre));
  const nota={ texto:txt, maestro:nombreDoc, fecha:hoy(), hora:hora(),
                grupo:`${grupoSel.grado}°${grupoSel.grupo}`, turno:grupoSel.turno, timestamp:Date.now() };
  try{
    await dbPush(`escuelas/${escActiva}/notas-docente/${nKey}`, nota);
    if(!notasCache[nKey]) notasCache[nKey]=[];
    notasCache[nKey].unshift(nota);
    document.getElementById(`nt-${i}`).value='';
    toast('✅ Nota guardada');
    // Refrescar tarjeta
    const card=document.getElementById(`al-${i}`);
    if(card) card.outerHTML=htmlAlumno(lista[i],i);
  }catch(e){ toast('❌ Error: '+e.message); }
};

// ── GUARDAR LISTA + SYNC ──
async function guardarLista(){
  const btn=document.getElementById('btn-guardar');
  btn.textContent='⏳ Guardando...'; btn.disabled=true;
  const f=hoy(), h=hora();
  const clave=san(`${grupoSel.turno}-${grupoSel.grado}-${grupoSel.grupo}`);
  const registro={
    fecha:f, hora:h, maestro:nombreDoc, escuela:escActiva,
    turno:grupoSel.turno, grado:grupoSel.grado, grupo:grupoSel.grupo,
    grupoDisplay:`${grupoSel.grado}° ${grupoSel.grupo}`,
    alumnos:lista.map(a=>({
      nombre:a.nombre, estatusMaestro:a.estatusDoc,
      estatusEscaner:a.estatusRaw||null, motivo:motivo(a.estatusRaw),
      retiro:a.retiro||false, horaRetiro:a.horaRetiro||null,
    })),
    timestamp:serverTimestamp(),
  };
  try{
    await dbPush(`escuelas/${escActiva}/listas-maestro/${f}/${clave}`, registro);

    // SYNC con asistencias/ si está dentro del horario permitido
    let sincOk=0;
    if(puedeSync()){
      const proms=lista
        .filter(a=>(a.estatusDoc==='P'||a.estatusDoc==='T')&&!a.estatusRaw)
        .map(async a=>{
          await dbPush(`escuelas/${escActiva}/asistencias`,{
            nombre:a.nombre, fecha:f, hora:h,
            turno:grupoSel.turno, grado:grupoSel.grado,
            grupoLetra:grupoSel.grupo, grupo:`${grupoSel.grado}°${grupoSel.grupo}`,
            estatus:a.estatusDoc==='P'?'asistencia':'retardo',
            registradoPor:'Docente', retiroTemprano:false, horaRetiro:null, timestamp:Date.now(),
          });
          a.estatusRaw=a.estatusDoc==='P'?'asistencia':'retardo';
          a.regPor='Docente'; a.syncOk=true; sincOk++;
        });
      await Promise.all(proms);
    }

    toast(`✅ Lista guardada${sincOk>0?` · ${sincOk} sincronizados`:' · Solo interno'}`);
    btn.textContent='✅ Guardada';

    if(sincOk>0){
      lista.forEach((a,i)=>{ if(a.syncOk){ const c=document.getElementById(`al-${i}`); if(c) c.outerHTML=htmlAlumno(a,i); } });
    }
  }catch(e){ toast('❌ Error al guardar.'); btn.textContent='💾 Guardar Lista'; btn.disabled=false; }
}

window.enviarWAPadre=function(idxOrKey, esModoDetalle=false){
  let nombre, notasArr=[], faltas=0, presentes=0, totalSesiones=0;

  if(esModoDetalle && alumnoDetalle){
    nombre=alumnoDetalle.nombre;
    const nKey=san(norm(nombre));
    notasArr=notasCache[nKey]||[];
    const s=statsCache[nKey]||{};
    faltas=s.F||0; presentes=(s.P||0)+(s.T||0); totalSesiones=s.total||0;
  } else {
    const a=lista[idxOrKey]; if(!a) return;
    nombre=a.nombre;
    const nKey=san(norm(nombre));
    notasArr=notasCache[nKey]||[];
    faltas=a.faltas||0; presentes=0; totalSesiones=0;
  }

  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const ahora=new Date();
  const fechaStr=`${ahora.getDate()} de ${meses[ahora.getMonth()]} de ${ahora.getFullYear()}`;

  let msg=`👨‍🏫 *Reporte escolar*\n`;
  msg+=`👤 Alumno: *${(nombre||'').toUpperCase()}*\n`;
  msg+=`🏫 Grupo: ${grupoSel.grado}°${grupoSel.grupo} · Turno ${grupoSel.turno}\n`;
  msg+=`📅 ${fechaStr}\n`;
  msg+=`👨‍🏫 Maestro: ${nombreDoc}\n`;
  msg+=`━━━━━━━━━━━━━━━━━━━━\n\n`;
  if(totalSesiones>0){
    const pct=Math.round(presentes/totalSesiones*100);
    msg+=`📊 *Asistencia en mi materia:* ${presentes}/${totalSesiones} clases asistidas (${pct}%)\n`;
  }
  if(faltas>0) msg+=`❌ *Faltas acumuladas:* ${faltas}\n`;
  msg+=`\n`;
  if(notasArr.length){
    msg+=`📝 *Notas del maestro:*\n`;
    notasArr.slice(0,6).forEach(n=>{ msg+=`• ${fechaLeg(n.fecha)} — ${n.texto}\n`; });
    msg+=`\n`;
  }
  msg+=`━━━━━━━━━━━━━━━━━━━━\n_LudoAssist · Docente_`;

  window.open('whatsapp://send?text='+encodeURIComponent(msg),'_blank');
  toast('📤 Abriendo WhatsApp...');
};

    </div>
    <div id="al-detalle"></div>
  `;

  // Precargar notas si no están en caché

window.buscarAlumno=function(){
  const txt=(document.getElementById('sg-input')?.value||'').toUpperCase().trim();
  const resCont=document.getElementById('al-resultados');
  if(txt.length<2){ resCont.innerHTML=`<div class="empty"><div class="empty-ico">👥</div><p>Escribe al menos 2 letras</p></div>`; return; }

  // Buscar en lista actual + stats
  const encontrados=new Set();
  lista.forEach(a=>{ if(norm(a.nombre).includes(txt)) encontrados.add(a.nombre); });
  Object.values(statsCache).forEach(s=>{ if(norm(s.nombre).includes(txt)) encontrados.add(s.nombre); });
  Object.keys(notasCache).forEach(k=>{ const nombre=Object.values(notasCache[k]||[])[0]?.nombre; if(nombre&&norm(nombre).includes(txt)) encontrados.add(nombre); });

  if(!encontrados.size){
    resCont.innerHTML=`<div class="empty"><div class="empty-ico">🔍</div><p>Sin resultados para "${txt}"</p></div>`; return;
  }

  resCont.innerHTML=[...encontrados].sort().map(nombre=>{
    const nKey=san(norm(nombre));
    const s=statsCache[nKey]||{P:0,T:0,F:0,J:0,total:0};
    const notas=notasCache[nKey]||[];
    const pct=s.total>0?Math.round((s.P+s.T)/s.total*100):null;
    const colPct=pct===null?'':pct>=80?'color:var(--emerald)':pct>=60?'color:var(--amber)':'color:var(--ruby)';
    return `<div class="al-list-item" onclick="abrirDetalleAlumno('${san(nombre)}','${nombre.replace(/'/g,"\\'")}')">
      <div>
        <div class="al-list-nombre">${nombre.toUpperCase()}</div>
        <div class="al-list-meta">F:${s.F} · T:${s.T} · J:${s.J}${notas.length?' · 📝'+notas.length+' nota'+(notas.length>1?'s':''):''}</div>
      </div>
      <div class="al-list-badges">
        ${pct!==null?`<span style="font-size:.72rem;font-weight:900;${colPct}">${pct}%</span>`:''}
        <span style="font-size:.8rem;color:var(--slate2);">›</span>
      </div>
    </div>`;
  }).join('');
};

window.abrirDetalleAlumno=async function(nKeySan, nombre){
  alumnoDetalle={nombre};
  const detCont=document.getElementById('al-detalle');
  detCont.innerHTML=`<div class="detalle-panel open"><div class="loader"></div></div>`;

  const nKey=san(norm(nombre));
  const s=statsCache[nKey]||{P:0,T:0,F:0,J:0,total:0};
  const notasArr=notasCache[nKey]||[];
  const pct=s.total>0?Math.round((s.P+s.T)/s.total*100):null;
  const colPct=pct===null?'':pct>=80?'background:#DCFCE7;color:#166534':pct>=60?'background:#FEF9C3;color:#854D0E':'background:#FEE2E2;color:#991B1B';

  // Cargar asistencias del docente para este alumno
  let asistRows='';
  try{
    const snapH=await dbGet(`escuelas/${escActiva}/listas-maestro`);
    const registros=[];
    if(snapH.exists()){
      snapH.forEach(fSnap=>{ fSnap.forEach(gSnap=>{ gSnap.forEach(sSnap=>{
        const r=sSnap.val(); if(r.maestro!==nombreDoc) return;
        const al=(r.alumnos||[]).find(a=>norm(a.nombre)===norm(nombre));
        if(al) registros.push({fecha:r.fecha,hora:r.hora,est:al.estatusMaestro,grupo:r.grupoDisplay||''});
      }); }); });
    }
    registros.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const icoEst={P:'✅',T:'⏰',F:'❌',J:'📝'};
    const colEst={P:'color:#166534',T:'color:#92400E',F:'color:#991B1B',J:'color:#164E63'};
    const etqEst={P:'Presente',T:'Retardo',F:'Falta',J:'Justificado'};
    asistRows=registros.slice(0,25).map((r,i)=>`
      <div class="asist-row">
        <div class="asist-fecha">${fechaLeg(r.fecha)} <span style="font-size:.6rem;color:var(--slate2);">${r.grupo}</span></div>
        <div class="asist-est" style="${colEst[r.est]||''}">${icoEst[r.est]||'—'} ${etqEst[r.est]||'—'}</div>
      </div>`).join('') || `<div style="font-size:.78rem;color:var(--slate2);font-style:italic;">Sin registros en este dispositivo.</div>`;
  }catch(e){ asistRows=`<div style="color:var(--ruby);font-size:.78rem;">Error al cargar.</div>`; }

  const notasHTML=notasArr.length
    ? notasArr.map(n=>`<div class="nota-det-item"><div class="nota-det-fecha">📅 ${fechaLeg(n.fecha)} · ${n.hora||''} · ${n.grupo||''}</div><div class="nota-det-txt">${n.texto}</div></div>`).join('')
    : `<div style="font-size:.78rem;color:var(--slate2);font-style:italic;">Sin notas registradas.</div>`;

  detCont.innerHTML=`
    <div class="detalle-panel open">
      <div class="det-hdr">
        <div>
          <div class="det-nombre">${nombre.toUpperCase()}</div>
          <div class="det-sub">Maestro: ${nombreDoc} · ${grupoSel.grado?grupoSel.grado+'°'+grupoSel.grupo:''}</div>
        </div>
        <button class="btn-det-x" onclick="cerrarDetalle()">✕</button>
      </div>
      <div class="det-stats-row">
        ${pct!==null?`<span class="det-stat" style="${colPct};font-size:.75rem;">${pct}% asistencia</span>`:''}
        <span class="det-stat" style="background:#DCFCE7;color:#166534;">✅ ${s.P}</span>
        <span class="det-stat" style="background:#FEE2E2;color:#991B1B;">❌ ${s.F}</span>
        ${s.T>0?`<span class="det-stat" style="background:#FEF9C3;color:#854D0E;">⏰ ${s.T}</span>`:''}
        ${s.J>0?`<span class="det-stat" style="background:#CFFAFE;color:#164E63;">📝 ${s.J}</span>`:''}
        ${notasArr.length?`<span class="det-stat" style="background:#F5F3FF;color:#5B21B6;">📝 ${notasArr.length} nota${notasArr.length>1?'s':''}</span>`:''}
      </div>
      <div class="det-sec">
        <div class="det-sec-title">📋 Asistencia en mi materia</div>
        ${asistRows}
      </div>
      <div class="det-sec">
        <div class="det-sec-title">📝 Notas del maestro</div>
        ${notasHTML}
      </div>
      <button class="btn-wa-padre" onclick="enviarWAPadre(0,true)">
        📤 Enviar resumen completo al padre por WhatsApp
      </button>
    </div>
  `;
  detCont.scrollIntoView({behavior:'smooth',block:'start'});
};

      <div class="s-card"><div class="s-num" style="color:var(--ruby);">${alertas}</div><div class="s-lbl">Alertas 5+</div></div>
    </div>
    <div style="font-size:.65rem;font-weight:900;color:var(--slate2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.55rem;">🚦 Semáforo — toca para ver historial</div>
    ${alumnos.map(a=>{
      const pct=a.total>0?Math.round((a.P+a.T)/a.total*100):0;
      const dotCls=a.F>=5?'sem-rojo':a.F>=3?'sem-amarillo':'sem-verde';
      const colPct=a.F>=5?'background:#FEE2E2;color:#991B1B':a.F>=3?'background:#FEF9C3;color:#854D0E':'background:#DCFCE7;color:#166534';
      const nKey=san(norm(a.nombre));
      const nNotas=(notasCache[nKey]||[]).length;
      return `<div class="sem-item" onclick="irVista('alumnos');setTimeout(()=>{document.getElementById('sg-input').value='${norm(a.nombre).slice(0,10)}';buscarAlumno();},100);">
        <div class="sem-dot ${dotCls}"></div>
        <div style="flex:1;">
          <div class="sem-nombre">${(a.nombre||'').toUpperCase()}</div>
          <div class="sem-meta">P:${a.P} T:${a.T} F:${a.F} J:${a.J}${nNotas?' · 📝'+nNotas:''}</div>
        </div>
        <span class="sem-pct" style="${colPct}">${pct}%</span>
        <span style="color:var(--slate2);font-size:.8rem;margin-left:.3rem;">›</span>
      </div>`;
    }).join('')}
  `;
}

async function recalcularStats(){
  if(!grupoSel.turno) return;
  statsCache={};
  try{
    const snap=await dbGet(`escuelas/${escActiva}/listas-maestro`);
    if(snap.exists()){
      snap.forEach(fSnap=>{ fSnap.forEach(gSnap=>{ gSnap.forEach(sSnap=>{
        const r=sSnap.val();
        if(r.maestro!==nombreDoc||r.turno!==grupoSel.turno||String(r.grado)!==String(grupoSel.grado)||r.grupo!==grupoSel.grupo) return;
        (r.alumnos||[]).forEach(a=>{
          const n=san(norm(a.nombre));
          if(!statsCache[n]) statsCache[n]={nombre:a.nombre,P:0,T:0,F:0,J:0,total:0};
          statsCache[n][a.estatusMaestro]=(statsCache[n][a.estatusMaestro]||0)+1;
          statsCache[n].total++;
        });
      }); }); });
    }
  }catch(e){}
}

// ══════════════════════════════════════════════
// VISTA: HISTORIAL
// ══════════════════════════════════════════════
async function renderVista_historial(){
  const cont=document.getElementById('main-content');
  cont.innerHTML=`<div style="font-size:.92rem;font-weight:900;color:var(--navy);margin-bottom:.65rem;">📂 Mis listas guardadas</div><div class="loader"></div>`;
  try{
    const snap=await dbGet(`escuelas/${escActiva}/listas-maestro`);
    histCache=[];
    if(snap.exists()){
      snap.forEach(fSnap=>{ fSnap.forEach(gSnap=>{ gSnap.forEach(sSnap=>{
        const r=sSnap.val(); if(r.maestro===nombreDoc) histCache.push(r);
      }); }); });
    }
    histCache.sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
    if(!histCache.length){ cont.innerHTML=`<div class="empty"><div class="empty-ico">📭</div><p>Sin listas guardadas aún</p></div>`; return; }
    cont.innerHTML=`
      <div style="font-size:.92rem;font-weight:900;color:var(--navy);margin-bottom:.65rem;">📂 Mis listas — ${histCache.length} sesión(es)</div>
      ${histCache.slice(0,40).map((r,i)=>{
        const p=r.alumnos?.filter(a=>a.estatusMaestro==='P').length||0;
        const f=r.alumnos?.filter(a=>a.estatusMaestro==='F').length||0;
        const t=r.alumnos?.filter(a=>a.estatusMaestro==='T').length||0;
        const j=r.alumnos?.filter(a=>a.estatusMaestro==='J').length||0;
        const tot=r.alumnos?.length||1;
        const pct=Math.round((p+t)/tot*100);
        const col=pct>=80?'color:var(--emerald)':pct>=60?'color:var(--amber)':'color:var(--ruby)';
        return `<div class="hist-card">
          <div class="hist-hdr" onclick="toggleHist(${i})">
            <div>
              <div class="hist-grupo">${r.grupoDisplay||''}</div>
              <div class="hist-fecha">📅 ${r.fecha} · ⏰ ${r.hora}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;">
              <div style="display:flex;gap:.3rem;">
                <span class="badge b-p">✅${p}</span>
                <span class="badge b-t">⏰${t}</span>
                <span class="badge b-f">❌${f}</span>
                ${j>0?`<span class="badge b-j">📝${j}</span>`:''}
              </div>
              <span style="font-size:.65rem;font-weight:800;${col}">${pct}% asistencia</span>
            </div>
          </div>
          <div class="hist-body" id="hb-${i}">
            ${(r.alumnos||[]).map(a=>{
              const ico={P:'✅',T:'⏰',F:'❌',J:'📝'}[a.estatusMaestro]||'❌';
              const col2={P:'color:#166534',T:'color:#92400E',F:'color:#991B1B',J:'color:#164E63'}[a.estatusMaestro]||'color:#991B1B';
              const etq={P:'Presente',T:'Retardo',F:'Falta',J:'Justificado'}[a.estatusMaestro]||'Falta';
              return `<div class="hist-row">
                <div class="hist-nom">${(a.nombre||'').toUpperCase()}</div>
                <div class="hist-est" style="${col2}">${ico} ${etq}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}`;
  }catch(e){ cont.innerHTML=`<div class="empty"><div class="empty-ico">⚠️</div><p>Error al cargar historial</p></div>`; }
}
window.toggleHist=function(i){ document.getElementById(`hb-${i}`)?.classList.toggle('open'); };

// ══════════════════════════════════════════════
// NAVEGACIÓN
// ══════════════════════════════════════════════
window.irVista=async function(vista){
  vistaActual=vista;
  ['lista','alumnos','stats','historial'].forEach(v=>{
    document.getElementById(`nav-${v}`)?.classList.toggle('active',v===vista);
  });
  document.getElementById('main-content').innerHTML=`<div style="text-align:center;padding:2rem;"><div class="loader"></div></div>`;
  alumnoDetalle=null;
  if(vista==='lista') renderVista_lista();
  else if(vista==='alumnos') await renderVista_alumnos();
  else if(vista==='stats') await renderVista_stats();
  else if(vista==='historial') await renderVista_historial();
  window.scrollTo(0,0);
};
</script>
